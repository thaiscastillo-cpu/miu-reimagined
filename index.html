function deadlineDay(date){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guatemala',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function taskDeadline(t){if(t.dueAt){const date=new Date(t.dueAt);return Number.isFinite(date.getTime())?date:null}if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date||''))return null;const match=String(t.due||'').match(/(\d{1,2}:\d{2})\s*$/),time=match?match[1].padStart(5,'0'):'23:59',date=new Date(t.date+'T'+time+':00-06:00');return Number.isFinite(date.getTime())?date:null}
function taskTiming(t,now=new Date()){const deadline=taskDeadline(t);if(!deadline)return {key:'neutral',label:'Fecha por confirmar',deadline:null};const remaining=deadline-now;if(remaining<0)return {key:'overdue',label:'Vencida',deadline};if(deadlineDay(deadline)===deadlineDay(now))return {key:'today',label:'Vence hoy',deadline};if(remaining<=7*86400000)return {key:'soon',label:'Vence en unos días',deadline};return {key:'neutral',label:'Próxima entrega',deadline}}
function deadlineText(deadline,now=new Date()){if(!deadline)return '';const day=deadlineDay(deadline),today=deadlineDay(now),tomorrow=deadlineDay(new Date(now.getTime()+86400000));const label=day===today?'Hoy':day===tomorrow?'Mañana':deadline.toLocaleDateString('es-GT',{day:'numeric',month:'short',timeZone:'America/Guatemala'});return label+' · '+deadline.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Guatemala'})}
function deadlineLegend(){return '<div class="deadline-legend" aria-label="Colores de los pendientes"><span><i class="legend-today" aria-hidden="true"></i>Vence hoy</span><span><i class="legend-overdue" aria-hidden="true"></i>Vencida</span><span><i class="legend-soon" aria-hidden="true"></i>Vence en unos días</span></div>'}
function taskRow(t){const c=C(t.course),r=state.receipts[t.id],timing=taskTiming(t),status=r?'submitted':timing.key;return `<div class="task-row due-${status}"><div class="task-icon">${I(t.group?'users':t.type==='Examen'?'calendar':'file')}</div><div class="task-copy"><h3>${esc(t.title)}</h3><p>${esc(c.name)} · ${t.weight}% de la nota</p><div class="task-meta"><span class="badge due-status">${r?(r.late?'Entregada · Tarde':'Entregada'):timing.label}</span>${!r?`<span class="small muted">${esc(t.type)}</span>`:''}${t.publishedAt&&!state.seenTasks?.includes(t.id)?'<span class="badge">Nuevo</span>':''}${t.group?'<span class="small muted">En grupo</span>':''}</div></div><div class="task-due">${timing.deadline?`<time datetime="${timing.deadline.toISOString()}">${esc(deadlineText(timing.deadline)).replace(' · ','<br>')}</time>`:esc(t.due)}${!r&&timing.key==='overdue'?'<span class="late-enabled">Entrega habilitada</span>':''}</div><button class="btn secondary" onclick="openTask(${t.id})">${r?'Ver entrega':t.type==='Examen'||t.type==='Lectura'?'Ver detalle':'Entregar'}${I('arrow')}</button></div>`}
function reminderRows(){return state.reminders.map(r=>{const timing=taskTiming({date:r.date,due:r.time||'23:59'});return `<div class="file-row reminder-item due-${timing.key}"><div><b>${esc(r.title)}</b><p class="small muted" style="margin-top:7px">${r.course==='personal'||!r.course?'Personal':esc(C(r.course)?.name||'Materia por confirmar')} · ${r.duration||30} min</p><span class="badge due-status" style="margin-top:8px">${timing.label}</span></div><span class="small muted">${esc(r.date)} ${esc(r.time||'')}</span></div>`}).join('')}

function noticeEntries(){return (state.notices||[]).filter(n=>!n.audience||n.audience===state.role)}
function unreadNotices(){return noticeEntries().filter(n=>!n.read&&!n.obsolete)}
function noticeBadge(){const n=unreadNotices().length;return n?`<span class="notice-badge" aria-label="${n} avisos sin leer">${n>9?'9+':n}</span>`:''}
function addNotice(item){state.notices=state.notices||[];if(state.notices.some(n=>n.key===item.key))return false;const notice={id:'notice-'+Date.now()+'-'+Math.random().toString(16).slice(2,7),createdAt:new Date().toISOString(),read:false,audience:'Estudiante',...item};state.notices.unshift(notice);save();if(state.browserNotices&&state.role===notice.audience&&typeof Notification!=='undefined'&&Notification.permission==='granted'){try{new Notification(notice.title,{body:notice.message,tag:notice.key})}catch{}}return true}
function refreshReminders(now=new Date()){const prefs=state.alertPrefs||{day:true,hour:true,daily:false};for(const t of pending()){const deadline=taskDeadline(t);if(!deadline)continue;const remaining=deadline-now;if(remaining<=0)continue;const threshold=remaining<=3600000&&prefs.hour!==false?'hour':remaining<=86400000&&prefs.day!==false?'day':null;if(!threshold)continue;addNotice({key:'deadline:'+t.id+':'+deadline.toISOString()+':'+threshold,type:'deadline',taskId:t.id,course:t.course,title:threshold==='hour'?'Tu entrega vence en menos de una hora':'Tu entrega se acerca',message:t.title+' · '+C(t.course).name+' · '+deadlineText(deadline,now),target:'task'})}if(prefs.daily){const day=deadlineDay(now),today=pending().filter(t=>taskDeadline(t)&&deadlineDay(taskDeadline(t))===day);addNotice({key:'daily:'+day,type:'summary',title:'Tu resumen de pendientes',message:`${today.length} actividades vencen hoy. Tenés ${pending().length} pendientes en total.`,target:'tasks'})}}
function updateNoticeBadge(){refreshReminders();const bell=document.querySelector('.notification');if(bell)bell.innerHTML=I('bell')+noticeBadge()}
function showNotifications(){refreshReminders();const list=noticeEntries().filter(n=>!n.obsolete);openModal('Tus avisos','Cambios de fecha, actividades y recordatorios.',`<div class="row between wrap" style="margin-bottom:18px"><button class="text-btn" onclick="markOrdinaryNoticesRead()">Marcar avisos leídos</button><button class="text-btn" onclick="notificationSettings()">Preferencias de avisos ↗</button></div>${list.length?list.map(n=>`<article class="notice-item ${!n.read?'unread':''}"><div class="row between wrap"><b>${esc(n.title)}</b>${n.critical&&!n.acknowledged?'<span class="badge red">Requiere confirmación</span>':!n.read?'<span class="badge">Nuevo</span>':''}</div><p>${esc(n.message)}</p><span class="small muted">${new Date(n.createdAt).toLocaleString('es-GT',{timeZone:'America/Guatemala'})}</span><div class="row wrap" style="margin-top:10px"><button class="text-btn" onclick="openNotice('${n.id}')">Ver ${n.target==='task'?'actividad':'detalle'} ↗</button>${n.critical&&!n.acknowledged?`<button class="btn soft" onclick="acknowledgeNotice('${n.id}')">Confirmar que vi el cambio</button>`:''}</div></article>`).join(''):'<div class="empty">Estás al día. Los nuevos avisos aparecerán aquí.</div>'}<p class="small muted" style="margin-top:20px;line-height:1.8">Los avisos se generan con los datos de esta demo y se conservan en este navegador. Los avisos al teléfono y por correo requieren conectar el servicio institucional.</p>`)}
function openNotice(id){const n=state.notices.find(n=>n.id===id);if(!n.critical||n.acknowledged)n.read=true;save();closeModal();if(n.target==='task'&&tasks().some(t=>t.id===n.taskId)){nav('tasks');openTask(n.taskId)}else nav(n.target==='grades'?'grades':n.target==='enroll'?'enroll':'tasks')}
function acknowledgeNotice(id){const n=state.notices.find(n=>n.id===id);n.read=true;n.acknowledged=true;save();updateNoticeBadge();showNotifications()}
function markOrdinaryNoticesRead(){noticeEntries().forEach(n=>{if(!n.critical||n.acknowledged)n.read=true});save();updateNoticeBadge();showNotifications()}
function notificationSettings(){const prefs=state.alertPrefs||{day:true,hour:true,daily:false};openModal('Tus recordatorios','Elegí cuándo querés recibir avisos.',`<label class="check-row"><input id="alert-day" type="checkbox" ${prefs.day!==false?'checked':''}>Recordar cuando falten menos de 24 horas</label><label class="check-row"><input id="alert-hour" type="checkbox" ${prefs.hour!==false?'checked':''}>Recordar cuando falte menos de una hora</label><label class="check-row"><input id="alert-daily" type="checkbox" ${prefs.daily?'checked':''}>Mostrar un resumen diario de pendientes</label><div class="notice" style="margin:20px 0">Los cambios de fecha siempre aparecen como avisos que requieren confirmación. Los avisos del navegador funcionan mientras esta página está abierta, si los habilitás.</div><div class="row wrap"><button class="btn secondary" onclick="enableBrowserNotices()">${state.browserNotices?'Revisar avisos del navegador':'Habilitar avisos en este navegador'}</button><button class="btn" onclick="saveAlertPreferences()">Guardar preferencias</button></div><p id="browser-notice-status" class="small muted" style="line-height:1.8;margin-top:14px">${state.browserNotices?'Avisos del navegador habilitados para esta demo.':'No se solicitarán permisos hasta que presionés el botón.'}</p>`)}
function saveAlertPreferences(){state.alertPrefs={day:document.querySelector('#alert-day').checked,hour:document.querySelector('#alert-hour').checked,daily:document.querySelector('#alert-daily').checked};state.notify=state.alertPrefs.day||state.alertPrefs.hour;save();closeModal();render();toast('Preferencias guardadas. Los cambios de fecha siempre se avisan.')}
async function enableBrowserNotices(){const status=document.querySelector('#browser-notice-status');if(typeof Notification==='undefined'){status.textContent='Este navegador no admite estos avisos. Seguirás viendo los avisos dentro de MiU.';return}try{const permission=await Notification.requestPermission();state.browserNotices=permission==='granted';save();status.textContent=state.browserNotices?'Listo. Recibirás avisos del navegador mientras MiU esté abierto.':'Los avisos dentro de MiU siguen disponibles. No se habilitaron los avisos del navegador.'}catch{status.textContent='No se pudo habilitar este canal. Los avisos dentro de MiU siguen funcionando.'}}
function invalidateTaskReminders(id){(state.notices||[]).filter(n=>n.type==='deadline'&&n.taskId===id).forEach(n=>{n.obsolete=true;n.read=true})}
function orderTasks(list){const mode=state.taskOrder||'urgency',ranks={overdue:0,today:1,soon:2,neutral:3};return [...list].sort((a,b)=>{if(mode==='weight')return b.weight-a.weight||(taskDeadline(a)||Infinity)-(taskDeadline(b)||Infinity);if(mode==='date')return (taskDeadline(a)||Infinity)-(taskDeadline(b)||Infinity);return ranks[taskTiming(a).key]-ranks[taskTiming(b).key]||(taskDeadline(a)||Infinity)-(taskDeadline(b)||Infinity)||b.weight-a.weight})}
function taskOrderControl(){return `<label class="task-order"><span>Ordenar por</span><select aria-label="Ordenar pendientes" onchange="state.taskOrder=this.value;save();render()">${[['urgency','Urgencia'],['date','Fecha de entrega'],['weight','Valor en la nota']].map(([key,label])=>`<option value="${key}" ${key===(state.taskOrder||'urgency')?'selected':''}>${label}</option>`).join('')}</select></label>`}
const firstSteps=[
 {title:'Encontrá lo que vence',text:'El Dashboard reúne tus pendientes. Amarillo significa que vence hoy, rojo que ya venció y verde que vence en los próximos siete días, después de hoy. Podés ordenar por urgencia, fecha o valor.',action:'Ver pendientes',target:'tasks'},
 {title:'Entregá y conservá tu comprobante',text:'Abrí una actividad y adjuntá archivos, enlaces o un documento de Drive de ejemplo. Podés entregar desde el teléfono. Después de confirmar, revisá el comprobante con fecha y hora.',action:'Abrir una actividad',target:'task'},
 {title:'Ubicá el material y a tu docente',text:'Mis cursos tiene siempre la misma estructura: programa PDF, actividades, materiales, catedrático, auxiliar y chat. Los ejemplos de programa se sustituirían por los documentos oficiales.',action:'Ir a mis cursos',target:'courses'},
 {title:'Prepará tu asignación',text:'Guardá un borrador, revisá horarios y cupos y consultá tu turno. Una solicitud en proceso todavía no es una asignación: verificá el estado y el comprobante.',action:'Preparar borrador',target:'enroll'},
 {title:'Consultá tu avance con privacidad',text:'Mis notas y Mi pensum están dentro de Mi progreso. El promedio se pondera por UMA y permanece fuera del Dashboard.',action:'Ver mi progreso',target:'progress'},
 {title:'Completá tus conferencias',text:'Mostrá tu QR personal al entrar y salir. Completá después la evaluación para que cuente la asistencia. Cada 30 asistencias equivalen a 1 UMA.',action:'Ver conferencias',target:'conferences'}
];
function guideBanner(){if(state.guideDismissed||state.guideStep!==undefined||(state.guideCompleted||[]).length===firstSteps.length)return '';if(!guideInvitationThisVisit){if(state.guideInvitationSeen)return '';guideInvitationThisVisit=true;state.guideInvitationSeen=true;save()}return '<div class="first-steps"><span>¿Primera vez en MiU? Conocé los pasos principales.</span><div class="row"><button class="text-btn" onclick="showGuide()">Guía rápida ↗</button><button class="guide-dismiss" aria-label="Ocultar invitación a la guía" onclick="hideGuideInvitation()">×</button></div></div>'}
function showGuide(index=state.guideStep||0){index=Math.max(0,Math.min(firstSteps.length-1,index));state.guideStep=index;hideGuideInvitation();save();const step=firstSteps[index],done=state.guideCompleted||[];openModal('Tu primer recorrido en MiU',`Paso ${index+1} de ${firstSteps.length}`,`<div class="progress" style="height:7px;margin-bottom:23px"><i style="width:${done.length/firstSteps.length*100}%;background:var(--purple)"></i></div><h2>${step.title}</h2><p style="font-size:13px;line-height:1.9;margin-top:16px">${step.text}</p><button class="btn secondary" style="margin-top:20px" onclick="guideAction(${index})">${step.action} ${I('arrow')}</button><p class="small muted" style="margin-top:18px">${done.length} pasos marcados como listos. Podés cerrar la guía y retomarla desde el botón ? de arriba.</p><div class="guide-step-dots">${firstSteps.map((s,i)=>`<button aria-label="Paso ${i+1}: ${esc(s.title)}" class="${i===index?'selected':''}" onclick="showGuide(${i})">${done.includes(i)?'✓':i+1}</button>`).join('')}</div>`,`<button class="btn secondary" ${index===0?'disabled':''} onclick="showGuide(${index-1})">Anterior</button><button class="btn" onclick="completeGuideStep(${index})">${index===firstSteps.length-1?'Terminar guía':'Listo, siguiente'} ${I('check')}</button>`)}
function guideAction(index){closeModal();const target=firstSteps[index].target;if(target==='task'){nav('tasks');openTask(pending()[0]?.id||1)}else if(target==='tasks')openPendingTasks();else nav(target)}
function completeGuideStep(index){state.guideCompleted=state.guideCompleted||[];if(!state.guideCompleted.includes(index))state.guideCompleted.push(index);save();if(index===firstSteps.length-1){state.guideDismissed=true;save();closeModal();render();toast('Guía terminada. Podés volver a abrirla desde el botón ?.')}else showGuide(index+1)}
if(typeof window!=='undefined'&&typeof window.addEventListener==='function'){setInterval(updateNoticeBadge,60000);window.addEventListener('online',updateNoticeBadge);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateNoticeBadge()})}

function enrollmentTurnAllowed(){return (state.enrollmentTurn||'honor')==='general'||state.honor}
function enrollmentDraft(){return (state.enrollmentDraft||[]).filter(id=>C(id)&&!state.assignments.includes(id))}


function courseConflicts(selected){const ids=[...new Set(selected)],conflicts=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=courseSlots(ids[i]),b=courseSlots(ids[j]);if(a&&b&&a.days.some(d=>b.days.includes(d))&&a.start<b.end&&b.start<a.end)conflicts.push([ids[i],ids[j]])}return conflicts}
function toggleEnrollmentDraft(id){if(state.assignments.includes(id))return;if(state.enrollmentAttempt?.status==='pending'){toast('La confirmación está en proceso.');return}if(!enrollmentDraft().includes(id)&&conflictingSectionCourses(id).length){toast('Esta sección choca con una clase de tu horario. Elegí otra sección.');return}state.enrollmentDraft=enrollmentDraft();if(state.enrollmentDraft.includes(id))state.enrollmentDraft=state.enrollmentDraft.filter(x=>x!==id);else state.enrollmentDraft.push(id);state.enrollmentDraftSavedAt=new Date().toISOString();save();render()}

function enrollmentQueuePanel(){const q=state.enrollmentQueue;if(!q||q.status==='idle')return '';return `<div class="notice enrollment-queue"><b>${q.status==='ready'?'Tu turno en la fila está listo':'Fila virtual · Demostración'}</b><p style="margin-top:8px;line-height:1.8">${q.status==='ready'?'Podés confirmar tu borrador. La disponibilidad se revisará antes de registrar los cursos.':`Tu posición de ejemplo es ${q.position}. El borrador sigue guardado. Entrar a la fila no reserva cupos.`}</p>${q.status==='waiting'?'<button class="btn secondary" style="margin-top:12px" onclick="advanceEnrollmentQueue()">Avanzar fila · Demo</button>':''}</div>`}
function enrollmentAttemptPanel(){const attempt=state.enrollmentAttempt;if(!attempt)return '';return `<section class="panel enrollment-attempt"><div class="row between wrap"><h2>${attempt.status==='complete'?'Solicitud registrada':attempt.status==='pending'?'Verificando tu solicitud':attempt.status==='retry'?'Conexión interrumpida':'No se pudo confirmar la solicitud'}</h2><span class="badge ${attempt.status==='complete'?'green':attempt.status==='rejected'?'red':'orange'}">${attempt.status==='complete'?'Registrada':attempt.status==='pending'?'En proceso':attempt.status==='retry'?'Reintento disponible':'Rechazada'}</span></div><p class="small muted" style="margin-top:12px;line-height:1.8">${esc(attempt.message||'Se revisan cupos, turno y horarios. Todavía no hay una asignación confirmada.')}</p><p class="small muted" style="margin-top:9px">Referencia: ${esc(attempt.token)}</p>${attempt.status==='complete'?`<button class="text-btn" onclick="enrollmentReceipt()">Ver comprobante ↗</button>`:attempt.status==='pending'||attempt.status==='retry'?'<button class="btn secondary" style="margin-top:15px" onclick="resumeEnrollmentAttempt()">Revisar estado y continuar</button>':'<button class="text-btn" onclick="reviewEnrollmentDraft()">Revisar horario ↗</button>'}</section>`}



function beginEnrollment(){if(!enrollmentTurnAllowed()||!enrollmentDraft().length)return;if(draftConflicts().length){toast('No se puede confirmar un horario con clases que chocan.');return}if(state.enrollmentHighDemand&&state.enrollmentQueue?.status!=='ready'){reviewEnrollmentDraft();return}if(typeof navigator!=='undefined'&&navigator.onLine===false){toast('Sin conexión. Tu borrador sigue guardado; podés reintentar.');return}if(['pending','retry'].includes(state.enrollmentAttempt?.status)&&JSON.stringify([...state.enrollmentAttempt.items].sort())===JSON.stringify([...enrollmentDraft()].sort())&&(!state.enrollmentAttempt.sectionsSnapshot||enrollmentDraft().every(id=>state.enrollmentAttempt.sectionsSnapshot[id]?.optionId===enrollmentChoice(id).optionId))){closeModal();resumeEnrollmentAttempt();return}state.enrollmentAttempt={token:'MIU-ASG-'+Date.now(),status:'pending',items:[...enrollmentDraft()],sectionsSnapshot:Object.fromEntries(enrollmentDraft().map(id=>[id,enrollmentChoice(id)])),createdAt:new Date().toISOString()};save();closeModal();render();const token=state.enrollmentAttempt.token;setTimeout(()=>finishEnrollment(token),700)}
function finishEnrollment(token){const attempt=state.enrollmentAttempt;if(!attempt||attempt.token!==token||attempt.status==='complete')return;if(attempt.sectionsSnapshot&&attempt.items.some(id=>attempt.sectionsSnapshot[id].optionId!==enrollmentChoice(id).optionId)){attempt.status='rejected';attempt.message='Cambiaste la selección de secciones. Revisá tu horario antes de confirmar.';save();render();return}if(state.enrollmentScenario==='network'){state.enrollmentScenario='normal';attempt.status='retry';attempt.message='La conexión se interrumpió antes de confirmar. No se duplicó la solicitud y tu borrador permanece guardado.';save();render();return}if(state.enrollmentScenario==='last-seat'){state.enrollmentScenario='normal';const id=attempt.items.find(id=>!state.assignments.includes(id));if(id){state.enrollmentOccupied=state.enrollmentOccupied||{};state.enrollmentOccupied[id]=enrollmentChoice(id).capacity}}
const unavailable=attempt.items.filter(id=>!state.assignments.includes(id)&&availableSeats(id)<1);if(!enrollmentTurnAllowed()||unavailable.length||courseConflicts([...attempt.items,...state.assignments]).length||(state.enrollmentHighDemand&&state.enrollmentQueue?.status!=='ready')){attempt.status='rejected';attempt.message=unavailable.length?'Se agotó el cupo de '+unavailable.map(id=>C(id).name).join(', ')+'. No se confirmó ningún curso de esta solicitud. Podés conservar el borrador o usar la lista de espera.':'Cambió el turno o existe un choque de horario. Revisá el borrador.';save();render();return}for(const id of attempt.items)if(!state.assignments.includes(id))state.assignments.push(id);state.enrollmentDraft=(state.enrollmentDraft||[]).filter(id=>!attempt.items.includes(id));attempt.status='complete';attempt.completedAt=new Date().toISOString();attempt.message='La asignación quedó registrada. Conservá este comprobante.';save();addNotice({key:attempt.token,type:'enrollment',title:'Asignación registrada',message:attempt.items.map(id=>C(id).name).join(' · '),target:'enroll'});render();toast('Asignación registrada. El comprobante está disponible.')}
function resumeEnrollmentAttempt(){if(!state.enrollmentAttempt||!['pending','retry'].includes(state.enrollmentAttempt.status))return;state.enrollmentAttempt.status='pending';save();render();const token=state.enrollmentAttempt.token;setTimeout(()=>finishEnrollment(token),700)}

function advanceEnrollmentQueue(){if(!state.enrollmentQueue||state.enrollmentQueue.status!=='waiting')return;state.enrollmentQueue.position--;if(state.enrollmentQueue.position<=0){state.enrollmentQueue.position=0;state.enrollmentQueue.status='ready'}save();render()}
function joinEnrollmentWaitlist(id){state.enrollmentWaitlist=state.enrollmentWaitlist||[];if(!state.enrollmentWaitlist.some(e=>e.course===id))state.enrollmentWaitlist.push({course:id,joinedAt:new Date().toISOString()});state.enrollmentDraft=enrollmentDraft().filter(x=>x!==id);save();render();toast('Curso agregado a la espera de demostración. No hay cupo reservado.')}

function enrollmentScenarios(){openModal('Escenarios de asignación','Controles de demostración',`<div class="field"><label for="enrollment-turn">Turno abierto</label><select id="enrollment-turn"><option value="honor" ${(state.enrollmentTurn||'honor')==='honor'?'selected':''}>Cuadro de honor</option><option value="general" ${state.enrollmentTurn==='general'?'selected':''}>General</option></select></div><label class="check-row"><input id="enrollment-demand" type="checkbox" ${state.enrollmentHighDemand?'checked':''}>Simular alta demanda y fila virtual</label><p class="small muted" style="line-height:1.8">El estado de cuadro de honor del perfil se configura en Administración. La fila es ilustrativa y no representa conexiones reales.</p>`,`<button class="btn secondary" onclick="resetEnrollmentScenario()">Restablecer cupos de demo</button><button class="btn" onclick="saveEnrollmentScenario()">Guardar escenario</button>`)}
function saveEnrollmentScenario(){state.enrollmentTurn=document.querySelector('#enrollment-turn').value;state.enrollmentHighDemand=document.querySelector('#enrollment-demand').checked;if(!state.enrollmentHighDemand)state.enrollmentQueue={status:'idle'};save();closeModal();render()}
function resetEnrollmentScenario(){state.enrollmentOccupied={};state.enrollmentOccupiedSections={};state.enrollmentScenario='normal';save();closeModal();render();toast('Se restableció la disponibilidad simulada; tus asignaciones se conservan.')}
function confirmEnroll(id){if(!enrollmentDraft().includes(id))toggleEnrollmentDraft(id);reviewEnrollmentDraft()}
function commitEnroll(id){if(!enrollmentDraft().includes(id))toggleEnrollmentDraft(id);beginEnrollment()}

let activityMaterialFiles=[];
function defaultActivityDate(){return deadlineDay(new Date(Date.now()+7*86400000))+'T23:59'}
function activityDraftValues(){return {id:Number(document.querySelector('#activity-id').value),editing:document.querySelector('#activity-editing').value==='true',title:document.querySelector('#activity-title').value.trim(),course:Number(document.querySelector('#activity-course').value),type:document.querySelector('#activity-type').value,category:document.querySelector('#activity-category')?.value||null,weight:Number(document.querySelector('#activity-weight').value),datetime:document.querySelector('#activity-date').value,desc:document.querySelector('#activity-desc').value.trim(),group:document.querySelector('#activity-group').checked,files:[...activityMaterialFiles],rubricEnabled:document.querySelector('#activity-rubric').checked,rubric:[0,1,2].map(i=>({title:document.querySelector('#rubric-title-'+i).value.trim(),points:Number(document.querySelector('#rubric-points-'+i).value)}))}}
function saveActivityDraft(){if(!document.querySelector('#activity-id'))return;state.activityEditorDraft={...activityDraftValues(),savedAt:new Date().toISOString()};save();const status=document.querySelector('#activity-draft-status');if(status)status.textContent='Borrador guardado · '+new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',timeZone:'America/Guatemala'})}
function newTask(editId){const existing=editId?tasks().find(t=>t.id===editId):null,saved=state.activityEditorDraft,canResume=saved&&(editId?saved.editing&&saved.id===editId:!saved.editing),base=canResume?saved:existing?{...existing,editing:true,datetime:existing.date+'T'+(String(existing.due).match(/(\d{2}:\d{2})$/)?.[1]||'23:59'),files:existing.materials||[],rubricEnabled:!!existing.rubric}: {id:Date.now(),editing:false,title:'',course:state.lastPublishedCourse||1,type:'Tarea',weight:10,datetime:defaultActivityDate(),desc:'',group:false,files:[],rubricEnabled:false};activityMaterialFiles=[...(base.files||[])];const rubric=base.rubric||[{title:'Análisis y aplicación',points:40},{title:'Argumentación y conclusiones',points:35},{title:'Presentación y fuentes',points:25}];openModal(existing?'Editar actividad':'Publicación rápida',existing?C(existing.course).name:'Campos esenciales, plantillas y guardado automático.',`<form id="new-task-form" oninput="saveActivityDraft()" onchange="saveActivityDraft()" onsubmit="event.preventDefault();createTask()"><input id="activity-id" type="hidden" value="${base.id}"><input id="activity-editing" type="hidden" value="${!!base.editing}"><div class="row between wrap"><span id="activity-draft-status" class="small muted">${canResume?'Borrador recuperado':'Se guarda mientras escribís'}</span><div class="row wrap"><button type="button" class="editor-template" onclick="applyActivityTemplate('Tarea',false)">Tarea</button><button type="button" class="editor-template" onclick="applyActivityTemplate('Lectura',false)">Lectura</button><button type="button" class="editor-template" onclick="applyActivityTemplate('Tarea',true)">Grupal</button></div></div><div class="field" style="margin-top:18px"><label for="activity-course">Curso</label><select id="activity-course" onchange="syncActivityCategories()">${courses.map(c=>`<option value="${c.id}" ${c.id===Number(base.course)?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"> function validatedActivityDraft(){const draft=activityDraftValues();if(!C(draft.course)||!draft.title||!draft.desc||!draft.datetime||!Number.isFinite(new Date(draft.datetime+'-06:00').getTime())){toast('Completá curso, título, instrucciones y fecha de entrega.');return null}if(!Number.isFinite(draft.weight)||draft.weight<0||draft.weight>100){toast('El valor debe estar entre 0 y 100.');return null}if(draft.rubricEnabled&&(draft.rubric.some(r=>!r.title||r.points<0)||draft.rubric.reduce((s,r)=>s+r.points,0)!==100)){toast('Completá los criterios de la rúbrica y verificá que sumen 100 puntos.');return null}return draft}

function createTask(){const d=validatedActivityDraft();if(!d)return;const old=d.editing?tasks().find(t=>t.id===d.id):null;if(!d.editing&&state.extraTasks.some(t=>t.id===d.id)){toast('Esta actividad ya se publicó.');return}const timestamp=new Date().toISOString(),activity={id:d.id,title:d.title,course:d.course,type:d.type,gradeCategory:d.category||guessActivityCategory(d,d.course),weight:d.weight,date:d.datetime.slice(0,10),due:d.datetime.slice(0,10)+' · '+d.datetime.slice(11),dueAt:new Date(d.datetime+'-06:00').toISOString(),group:d.group&&d.type==='Tarea',desc:d.desc,materials:d.files,rubric:d.rubricEnabled?d.rubric:null,publishedAt:old?.publishedAt||timestamp,updatedAt:timestamp,version:(old?.version||0)+1};if(old){state.taskEdits=state.taskEdits||{};state.taskEdits[d.id]=activity}else state.extraTasks.push(activity);state.lastPublishedCourse=d.course;state.activityEditorDraft=null;save();const dateChanged=old&&taskDeadline(old)?.toISOString()!==activity.dueAt;if(dateChanged){invalidateTaskReminders(d.id);addNotice({key:'changed:'+d.id+':'+activity.version,type:'deadline-change',critical:true,taskId:d.id,course:d.course,title:'Cambió la fecha de una actividad',message:d.title+' · '+C(d.course).name+'\nAntes: '+deadlineText(taskDeadline(old))+'\nAhora: '+deadlineText(new Date(activity.dueAt)),target:'task'})}else addNotice({key:'activity:'+d.id+':'+activity.version,type:old?'activity-update':'new-activity',taskId:d.id,course:d.course,title:old?'Actividad actualizada':'Nueva actividad publicada',message:d.title+' · '+C(d.course).name+' · '+d.weight+'% · '+deadlineText(new Date(activity.dueAt)),target:'task'});closeModal();render();toast(old?'Cambios publicados. El estudiante tiene un aviso.':'Actividad publicada. Ya aparece en los pendientes del estudiante.')}

let enrollmentSearch='';
function enrollmentSectionOptions(id){const c=C(id),friday=[8,9.5,11,13,14.5][Math.max(0,id-4)%5],format=n=>String(Math.floor(n)).padStart(2,'0')+':'+(n%1?'30':'00'),baseTime=courseTimeKnown(c.time)?c.time:`Vie ${format(friday)}–${format(friday+1.5)}`;const original={key:'original',section:c.section,teacher:c.teacher,time:baseTime,room:c.room,capacity:id===1?state.adminCapacity:c.capacity};if(c.workshop)return [original];const labels=['A','B','C','D'].filter(x=>x!==c.section),alternateTimes=id===1?['Lun · Mié 10:00–11:20','Mar · Jue 14:00–15:20']:id===2?['Lun · Mié 08:00–09:20','Mar · Jue 16:00–17:20']:id===3?['Mar · Jue 14:00–15:20','Lun · Mié 16:00–17:20']:[`Mar · Jue ${format(8+(id%3)*2)}–${format(9.5+(id%3)*2)}`,`Lun · Mié ${format(12+(id%3)*2)}–${format(13.5+(id%3)*2)}`];return [original,...labels.slice(0,2).map((section,i)=>({key:'alternative-'+i,section,teacher:(c.teacher+i+1)%teachers.length,time:alternateTimes[i],room:i?'Aula C-202':'Aula B-205',capacity:c.capacity+(i?0:2)}))]}
function courseTimeKnown(value){return /\d{2}:\d{2}[–-]\d{2}:\d{2}/.test(value)}
function enrollmentChoice(id,optionKey){const c=C(id),options=enrollmentSectionOptions(id),option=options.find(o=>o.key===(optionKey||state.enrollmentSections?.[id]||'original'))||options[0];return {...c,...option,optionId:option.key}}
function availableSeats(id,optionKey){const option=enrollmentChoice(id,optionKey),selected=enrollmentChoice(id),occupied=state.enrollmentOccupiedSections?.[id+':'+option.optionId]??(option.optionId===selected.optionId?state.enrollmentOccupied?.[id]||0:0),ownSeat=state.assignments.includes(id)&&selected.optionId===option.optionId?1:0;return Math.max(0,option.capacity-occupied-ownSeat)}
function courseSlots(id,optionKey){const c=enrollmentChoice(id,optionKey),match=c.time.match(/(\d{2}):(\d{2})[–-](\d{2}):(\d{2})/);if(!match)return null;return {days:['Lun','Mar','Mié','Jue','Vie','Sáb'].filter(d=>c.time.includes(d)),start:Number(match[1])*60+Number(match[2]),end:Number(match[3])*60+Number(match[4])}}
function selectEnrollmentSection(id,key){if(state.assignments.includes(id))return;if(state.enrollmentAttempt?.status==='pending'){toast('La confirmación está en proceso. Revisá su estado antes de cambiar la sección.');return}if(!enrollmentSectionOptions(id).some(o=>o.key===key))return;const conflicts=conflictingSectionCourses(id,key);if(conflicts.length){toast('No podés agregar esta sección: choca con '+conflicts.map(other=>C(other).name).join(', ')+'. Elegí otro horario.');return}const previous=enrollmentChoice(id);if(state.enrollmentOccupied?.[id]!==undefined){state.enrollmentOccupiedSections=state.enrollmentOccupiedSections||{};state.enrollmentOccupiedSections[id+':'+previous.optionId]=state.enrollmentOccupied[id];delete state.enrollmentOccupied[id]}state.enrollmentSections=state.enrollmentSections||{};state.enrollmentSections[id]=key;state.enrollmentDraft=enrollmentDraft();if(!state.enrollmentDraft.includes(id))state.enrollmentDraft.push(id);state.enrollmentDraftSavedAt=new Date().toISOString();save();render()}
function rememberEnrollmentSubject(id,isOpen){state.enrollmentExpanded=state.enrollmentExpanded||{};state.enrollmentExpanded[id]=isOpen;save()}
function sectionOptionHTML(c,option){const conflicts=conflictingSectionCourses(c.id,option.key);const picked=(enrollmentDraft().includes(c.id)||state.assignments.includes(c.id))&&enrollmentChoice(c.id).optionId===option.key,seats=availableSeats(c.id,option.key),locked=state.assignments.includes(c.id)||state.enrollmentAttempt?.status==='pending';return `<article class="section-option ${picked?'picked':''} ${conflicts.length?'section-conflict-blocked':''}"><label class="section-choice"><input type="radio" name="subject-${c.id}" value="${option.key}" ${picked?'checked':''} ${locked||!seats||conflicts.length?'disabled':''} onchange="selectEnrollmentSection(${c.id},this.value)"><span><b>${teachers[option.teacher].name}</b><strong>${option.time}</strong><small>Sección ${option.section} · ${option.room}</small>${conflicts.length?`<span class="section-conflict-message">Choca con ${esc(conflicts.map(id=>C(id).name).join(', '))}</span>`:''}</span></label><div class="section-secondary"><button class="text-btn" onclick="teacherDetail(${option.teacher})">Perfil y reseñas ↗</button><span class="small muted">${seats?'Cupo disponible':'Sin cupo'}</span>${!seats&&!locked?`<button class="text-btn" onclick="joinSectionWaitlist(${c.id},'${option.key}')">Lista de espera</button>`:''}${picked?`<span class="section-selected-label">${state.assignments.includes(c.id)?'✓ Confirmada':'✓ En tu horario'}</span>`:''}</div></article>`}
function enrollmentSubjectHTML(c){const selected=enrollmentDraft().includes(c.id)||state.assignments.includes(c.id),expanded=state.enrollmentExpanded?.[c.id]??c.id===1;return `<details class="enrollment-subject" ${expanded?'open':''} ontoggle="rememberEnrollmentSubject(${c.id},this.open)"><summary><span><b>${c.name}</b><small>${c.credits} UMA${selected?' · Sección '+enrollmentChoice(c.id).section+' seleccionada':''}</small></span><span class="subject-expand" aria-hidden="true">⌄</span></summary><div class="subject-sections">${enrollmentSectionOptions(c.id).map(option=>sectionOptionHTML(c,option)).join('')}</div></details>`}
function enrollmentWeekPreview(){const ids=[...new Set([...state.assignments,...enrollmentDraft()])],conflicts=new Set(courseConflicts(ids).flat());return `<div class="plan-week-scroll"><div class="plan-week"><div class="plan-hour-col"><div></div>${[7,9,11,13,15,17].map(h=>`<span>${h}:00</span>`).join('')}</div>${['Lun','Mar','Mié','Jue','Vie','Sáb'].map(day=>{const items=ids.map(id=>({id,choice:enrollmentChoice(id),slots:courseSlots(id)})).filter(c=>c.slots?.days.includes(day));return `<div class="plan-day"><b>${day}</b><div>${items.map((c,index)=>{const overlap=items.some(other=>other.id!==c.id&&c.slots.start<other.slots.end&&other.slots.start<c.slots.end);return `<button class="plan-class ${conflicts.has(c.id)?'conflict':''}" style="top:${(c.slots.start-420)/60*32}px;height:${Math.max(35,(c.slots.end-c.slots.start)/60*32)}px;${overlap?`width:calc(50% - 3px);left:${index%2?'50%':'2px'};`:''}" onclick="showPlannedSection(${c.id})"><strong>${c.choice.name}</strong><span>${c.choice.section} · ${c.choice.time.match(/\d{2}:\d{2}/)?.[0]||''}</span></button>`}).join('')}</div></div>`}).join('')}</div></div>`}
function showPlannedSection(id){const c=enrollmentChoice(id);openModal(c.name,'Sección '+c.section,`<div class="rubric"><b>${teachers[c.teacher].name}</b><br>${c.time}<br>${c.room}<br>${c.credits} UMA</div>`,`<button class="btn secondary" onclick="teacherDetail(${c.teacher})">Perfil del catedrático</button>`)}
function enrollmentSummary(){const draft=enrollmentDraft(),conflicts=draftConflicts(),locked=state.enrollmentAttempt?.status==='pending';return `<section class="panel plan-summary"><div class="row between"><h2>Tu horario</h2><span class="badge">${draft.reduce((sum,id)=>sum+C(id).credits,0)} UMA</span></div><p class="small muted" style="margin:10px 0 17px;line-height:1.7">Elegí una sección por materia. Confirmarás todo al final.</p>${enrollmentWeekPreview()}${draft.length?`<div class="plan-selections">${draft.map(id=>{const c=enrollmentChoice(id);return `<div class="planned-course"><div><b>${c.name}</b><span>${teachers[c.teacher].name}</span><small>${c.time} · Sección ${c.section}</small></div><button ${locked?'disabled':''} aria-label="Quitar ${esc(c.name)} del horario" onclick="toggleEnrollmentDraft(${id})">×</button></div>`}).join('')}</div>`:'<div class="plan-empty">Tu horario se irá armando al seleccionar secciones.</div>'}${conflicts.length?`<div class="plan-conflicts">Hay un choque entre ${conflicts.map(([a,b])=>C(a).name+' y '+C(b).name).map(esc).join('; ')}. Probá otra sección.</div>`:''}<button class="btn" style="width:100%;margin-top:18px" ${!draft.length||conflicts.length||locked?'disabled':''} onclick="reviewEnrollmentDraft()">${locked?'Confirmación en proceso':'Revisar horario'} ${I('arrow')}</button><p class="plan-saved">${state.enrollmentDraftSavedAt?'✓ Selección guardada':'Se guarda mientras elegís'}</p></section>`}
function enrollView(){const list=courses.filter(c=>!enrollmentSearch||c.name.toLowerCase().includes(enrollmentSearch.toLowerCase()));return heading('Asignación','Compará catedráticos y horarios, materia por materia.',`<span class="badge enrollment-turn-badge">${state.honor?'★ Cuadro de honor':'Turno general'} · ${enrollmentTurnAllowed()?'Habilitado':'Por abrir'}</span>`)+`${enrollmentQueuePanel()}${enrollmentAttemptPanel()}<div class="enrollment-planner"><section class="enrollment-catalog"><form class="subject-search" onsubmit="event.preventDefault();enrollmentSearch=this.subject.value.trim();render()">${I('search')}<input name="subject" aria-label="Buscar materia para asignación" placeholder="Buscar una materia" value="${esc(enrollmentSearch)}"><button class="text-btn">Buscar</button>${enrollmentSearch?'<button type="button" class="text-btn" onclick="enrollmentSearch=\'\';render()">Limpiar</button>':''}</form>${list.length?list.map(enrollmentSubjectHTML).join(''):'<div class="empty">No encontramos esa materia.</div>'}<p class="small muted" style="line-height:1.8;margin-top:17px">Las secciones, docentes y horarios de esta oferta son de demostración. La disponibilidad se revisa nuevamente al confirmar.</p></section><aside class="enrollment-plan-side">${enrollmentSummary()}</aside></div>${enrollmentWaitlistPanel()}<details class="enrollment-demo-tools" style="margin-top:22px"><summary>Opciones de demostración</summary><div class="row wrap" style="margin-top:14px"><button class="btn secondary" onclick="enrollmentScenarios()">Turnos y alta demanda</button><button class="btn secondary" onclick="state.enrollmentScenario='network';save();toast('La próxima confirmación probará una interrupción de conexión.')">Probar interrupción</button><button class="btn secondary" onclick="state.enrollmentScenario='last-seat';save();toast('La próxima confirmación probará un cupo agotado.')">Probar cupo agotado</button></div></details>`}
function reviewEnrollmentDraft(){const draft=enrollmentDraft();if(!draft.length){toast('Elegí una sección de al menos una materia.');return}if(!enrollmentTurnAllowed()){openModal('Tu horario está guardado','Tu turno todavía no abre.','<div class="notice">Podés comparar secciones y preparar tu horario. La confirmación se habilita cuando abre tu turno.</div>');return}if(state.enrollmentHighDemand&&state.enrollmentQueue?.status!=='ready'){if(state.enrollmentQueue?.status!=='waiting')state.enrollmentQueue={status:'waiting',position:3,enteredAt:new Date().toISOString()};save();render();toast('Tu selección está guardada en la fila de demostración.');return}const missing=draft.filter(id=>!availableSeats(id)),conflicts=draftConflicts();openModal('Confirmá tu horario',`${draft.length} materias · ${draft.reduce((sum,id)=>sum+C(id).credits,0)} UMA`,`${draft.map(id=>{const c=enrollmentChoice(id);return `<div class="review-section"><h3>${c.name} · ${c.section}</h3><b>${teachers[c.teacher].name}</b><p>${c.time}<br>${c.room}</p><span class="badge ${availableSeats(id)?'green':'red'}">${availableSeats(id)?'Cupo disponible':'Se agotó el cupo'}</span></div>`}).join('')}${missing.length?'<div class="notice" style="margin-top:15px">Se agotó el cupo de una sección. Elegí otra sección o agregala a la lista de espera.</div>':''}${conflicts.length?'<div class="notice" style="margin-top:15px">Corregí los choques de horario antes de confirmar.</div>':''}<p class="small muted" style="line-height:1.8;margin-top:18px">Se confirmará el horario completo en una sola solicitud. Este recorrido es de demostración.</p>`,`<button class="btn secondary" onclick="closeModal()">Seguir armando mi horario</button><button class="btn" ${missing.length||conflicts.length?'disabled':''} onclick="beginEnrollment()">Confirmar todo ${I('check')}</button>`)}
function enrollmentReceipt(){const attempt=state.enrollmentAttempt;if(!attempt||attempt.status!=='complete')return;openModal('Tu horario quedó confirmado',attempt.token,`<div class="receipt"><b>✓ Asignación registrada · Demo</b><br>${esc(attempt.token)}<br>${new Date(attempt.completedAt).toLocaleString('es-GT',{timeZone:'America/Guatemala'})}</div>${attempt.items.map(id=>{const c=attempt.sectionsSnapshot?.[id]||enrollmentChoice(id);return `<div class="review-section"><h3>${c.name} · Sección ${c.section}</h3><b>${teachers[c.teacher].name}</b><p>${c.time}<br>${c.room} · ${c.credits} UMA</p></div>`}).join('')}<p class="small muted" style="margin-top:16px">Este comprobante se conserva en este navegador. No cambia tu asignación universitaria real.</p>`)}
function joinSectionWaitlist(id,key){if(state.assignments.includes(id))return;state.enrollmentSections=state.enrollmentSections||{};state.enrollmentSections[id]=key;joinEnrollmentWaitlist(id);const entry=state.enrollmentWaitlist.find(e=>e.course===id);if(entry)entry.section=key;save();render()}
function enrollmentWaitlistPanel(){const list=state.enrollmentWaitlist||[];return list.length?`<section class="panel" style="margin-top:22px"><h2>Secciones en espera</h2>${list.map(entry=>{const c=enrollmentChoice(entry.course,entry.section);return `<div class="file-row"><div><b>${c.name} · Sección ${c.section}</b><p class="small muted" style="margin-top:6px">${teachers[c.teacher].name} · ${c.time}</p></div><button class="text-btn" onclick="checkWaitingCourse(${entry.course})">Revisar disponibilidad ↗</button></div>`}).join('')}</section>`:''}
function checkWaitingCourse(id){const entry=(state.enrollmentWaitlist||[]).find(e=>e.course===id);if(!entry)return;if(conflictingSectionCourses(id,entry.section).length){toast('Esta sección choca con una clase elegida. Cambiá tu horario antes de recuperarla.');return}if(availableSeats(id,entry.section)<1){toast('Esta sección sigue sin cupo. Tu selección en espera está guardada.');return}state.enrollmentWaitlist=state.enrollmentWaitlist.filter(e=>e.course!==id);state.enrollmentSections=state.enrollmentSections||{};state.enrollmentSections[id]=entry.section||state.enrollmentSections[id]||'original';state.enrollmentDraft=enrollmentDraft();if(!state.enrollmentDraft.includes(id))state.enrollmentDraft.push(id);save();render();toast('La sección volvió a tu horario para que la confirmés.')}

function studentName(){return String(state.profile?.name||'').trim()||'Sofía · Perfil de ejemplo'}
function studentAvatar(){const i=esc(studentInitials()),pic=state.profile?.picture;return /^https:\/\//.test(pic||'')?`<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.replaceWith('${i}')">`:i}
function studentInitials(){const n=String(state.profile?.name||'').trim().split(/\s+/).filter(Boolean);return n.length?(n[0][0]+(n.length>1?n[n.length-1][0]:'')).toUpperCase():'SO'}
function dashboardFirstName(){const name=state.profile?.given_name||state.profile?.givenName||state.profile?.name||'Sofía';return String(name).trim().split(/\s+/)[0]||'Sofía'}

function sidebarFaculty(){return state.profile?.faculty||'Facultad de Ciencias Económicas'}

function courseView(){const c=C(activeCourse),activities=tasks().filter(t=>t.course===c.id),remaining=orderTasks(activities.filter(t=>!state.receipts[t.id]));return heading(c.name,`${c.code} · Sección ${c.section} · Segundo semestre 2026`,`<button class="btn secondary" onclick="nav('courses')">← Mis cursos</button>`)+`<div class="two-col"><div class="stack"><div><button class="btn secondary" onclick="showProgram(${c.id})">${I('file')}Ver programa del curso</button></div><details class="course-pending dashboard-collapse" ${state.coursePendingExpanded?.[c.id]?'open':''} ontoggle="rememberCoursePending(${c.id},this.open)"><summary><h2>Pendientes <span class="small muted" style="margin-left:7px">${remaining.length}</span></h2><span class="collapse-chevron" aria-hidden="true">⌄</span></summary><div class="dashboard-collapse-body"><div class="panel tasks" style="margin-top:13px">${remaining.length?remaining.map(courseTaskRow).join(''):'<div class="empty">No tenés pendientes en este curso.</div>'}</div></div></details><details class="panel course-materials" ${state.courseMaterialExpanded?.[c.id]?'open':''} ontoggle="rememberCourseMaterial(${c.id},this.open)"><summary><h2>Material de clase</h2><span class="collapse-chevron" aria-hidden="true">⌄</span></summary><div class="course-material-content">${[{title:'Lectura · Semana 12',index:1},{title:'Presentación · Última clase',index:2}].map(item=>`<button class="file-row" style="width:100%;text-align:left" onclick="materialDetail(${item.index})"><span class="row">${I('file')}${item.title}</span><span class="badge">Ver</span></button>`).join('')}</div></details>${courseActivityGrades(c.id)}</div><aside class="stack"><section class="panel course-team">${courseStaffCard(c.id,'teacher')}${courseStaffCard(c.id,'aux')}<button class="btn soft" style="width:100%;margin-top:17px" onclick="openClassChat(${c.id})">${I('chat')}Chat de la clase</button></section><section class="panel"><h2>Horario y salón</h2><p class="small muted" style="line-height:2;margin-top:15px">${c.time}<br>${c.room}</p><button class="text-btn" onclick="nav('schedule')">Ver mi horario completo ↗</button></section></aside></div>`}
function rememberCoursePending(id,isOpen){state.coursePendingExpanded=state.coursePendingExpanded||{};state.coursePendingExpanded[id]=isOpen;save()}
function staffEmail(id,kind){const c=C(id);return String(kind==='teacher'?state.courseContacts?.[id]?.teacherEmail||teachers[c.teacher].email||'':state.courseContacts?.[id]?.auxEmail||'').trim()}
function staffEmailHTML(id,kind){const email=staffEmail(id,kind);return email?`<a class="course-staff-email" href="mailto:${encodeURIComponent(email)}">${esc(email)}</a>`:'<span class="course-staff-email muted">Correo por confirmar</span>'}
function personInitials(name){return name==='Por confirmar'?'?':String(name).trim().split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase()}
function courseStaffCard(id,kind){const c=C(id),teacher=kind==='teacher',name=teacher?teachers[c.teacher].name:auxFor(id),initials=teacher?teachers[c.teacher].initials:personInitials(name);return `<div class="course-staff"><span class="eyebrow muted">${teacher?'Tu catedrático':'Tu auxiliar'}</span><div class="row course-staff-person"><div class="avatar">${esc(initials)}</div><div><h3>${esc(name)}</h3>${staffEmailHTML(id,kind)}</div></div><button class="text-btn" aria-label="Ver perfil y reseñas del ${teacher?'catedrático':'auxiliar'}" onclick="${teacher?`teacherDetail(${c.teacher})`:`auxProfile(${id})`}">Ver perfil y reseñas ↗</button></div>`}

function auxProfile(id){const c=C(id),name=auxFor(id),reviews=(state.auxReviews||[]).filter(r=>r.course===id),average=reviews.length?(reviews.reduce((sum,r)=>sum+r.rating,0)/reviews.length).toFixed(1):null;openModal(name==='Por confirmar'?'Perfil del auxiliar':name,c.name,`<div class="row"><div class="avatar" style="height:54px;width:54px;font-size:18px">${esc(personInitials(name))}</div><div><h3>${esc(name)}</h3><p class="small muted" style="margin-top:6px">Auxiliar de ${c.name}</p>${staffEmailHTML(id,'aux')}</div></div><div class="rubric" style="margin-top:20px">Apoyo académico y acompañamiento del curso.<br>Horario de atención: por confirmar.</div><h3>Experiencias de estudiantes</h3>${average?`<span class="badge orange">★ ${average} / 5 · ${reviews.length} reseñas locales</span>`:''}${reviews.length?reviews.map(r=>`<div class="review"><span class="small muted">${r.rating} / 5</span><p>${esc(r.text)}</p></div>`).join(''):'<p class="small muted" style="line-height:1.8">Todavía no hay reseñas publicadas para este auxiliar en la demo.</p>'}<button class="text-btn" style="margin-top:15px" onclick="auxReviewForm(${id})">Escribir una reseña ↗</button><p class="small muted" style="margin-top:18px">Los datos del auxiliar se muestran según la información cargada. Las reseñas se guardan solo en esta demo.</p>`)}
function auxReviewForm(id){openModal('Tu experiencia con el auxiliar',C(id).name,`<form onsubmit="event.preventDefault();saveAuxReview(${id})"><div class="field"><label for="aux-rating">Valoración</label><select id="aux-rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} / 5</option>`).join('')}</select></div><div class="field"><label for="aux-review-text">Apoyo, claridad y acompañamiento académico</label><textarea id="aux-review-text" required minlength="10" maxlength="800" placeholder="Contá qué le serviría saber a otro estudiante…"></textarea></div><button class="btn">Guardar reseña en la demo</button></form>`)}
function saveAuxReview(id){const text=document.querySelector('#aux-review-text').value.trim(),rating=Number(document.querySelector('#aux-rating').value);if(text.length<10||rating<1||rating>5){toast('Escribí al menos 10 caracteres y elegí una valoración de 1 a 5.');return}state.auxReviews=state.auxReviews||[];state.auxReviews.push({course:id,text,rating});save();auxProfile(id);toast('Reseña guardada en esta demo.')}
function editCourseEmails(id){openModal('Correos del equipo docente',C(id).name,`<form onsubmit="event.preventDefault();saveCourseEmails(${id})"><div class="field"><label for="teacher-email">Correo del catedrático</label><input id="teacher-email" type="email" value="${esc(staffEmail(id,'teacher'))}" placeholder="Ingresá el correo confirmado"></div><div class="field"><label for="aux-email">Correo del auxiliar</label><input id="aux-email" type="email" value="${esc(staffEmail(id,'aux'))}" placeholder="Ingresá el correo confirmado"></div><p class="small muted" style="line-height:1.8;margin-bottom:18px">Los campos vacíos aparecerán como “Correo por confirmar”. No se envían correos desde este formulario.</p><button class="btn">Guardar correos</button></form>`)}
function saveCourseEmails(id){const teacherEmail=document.querySelector('#teacher-email').value.trim(),auxEmail=document.querySelector('#aux-email').value.trim(),valid=email=>!email||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);if(!valid(teacherEmail)||!valid(auxEmail)){toast('Revisá el formato de los correos.');return}state.courseContacts=state.courseContacts||{};state.courseContacts[id]={teacherEmail,auxEmail};save();closeModal();render();toast('Correos actualizados en el curso.')}


function courseTaskRow(t){return taskRow(t).replace(/(<div class="task-copy"><h3>[\s\S]*?<\/h3>)<p>[\s\S]*?<\/p>/,'$1')}


function conflictingSectionCourses(id,optionKey){const candidate=courseSlots(id,optionKey);if(!candidate)return [];return [...new Set([...enrollmentDraft(),...state.assignments])].filter(other=>{if(other===id)return false;const existing=courseSlots(other);return existing&&candidate.days.some(day=>existing.days.includes(day))&&candidate.start<existing.end&&existing.start<candidate.end})}

function gradingCategories(id){if(state.courseGradeCategories?.[id]?.length)return state.courseGradeCategories[id];if(id===1)return [{id:'partial1',name:'Primer parcial',weight:20},{id:'partial2',name:'Segundo parcial',weight:20},{id:'quizzes',name:'Exámenes cortos',weight:15},{id:'assignments',name:'Entregables',weight:15},{id:'final',name:'Examen final',weight:30}];if(id===2)return [{id:'partials',name:'Parciales',weight:35},{id:'assignments',name:'Ensayos y trabajos',weight:25},{id:'participation',name:'Participación',weight:10},{id:'final',name:'Examen final',weight:30}];if(id===3)return [{id:'partials',name:'Parciales',weight:40},{id:'projects',name:'Proyecto',weight:30},{id:'labs',name:'Laboratorios',weight:30}];if(C(id).workshop)return [{id:'assignments',name:'Actividades del workshop',weight:100}];return [{id:'partials',name:'Parciales',weight:40},{id:'assignments',name:'Trabajos y proyectos',weight:30},{id:'final',name:'Examen final',weight:30}]}
function guessActivityCategory(t,id=t.course){const categories=gradingCategories(id),has=key=>categories.some(c=>c.id===key);if(Number(t.weight)===0||t.type==='Lectura')return 'ungraded';if(t.type==='Examen'){if(/final/i.test(t.title||'')&&has('final'))return 'final';if(/corto|quiz/i.test(t.title||'')&&has('quizzes'))return 'quizzes';if(/segundo|2[ºo]?\s*parcial/i.test(t.title||'')&&has('partial2'))return 'partial2';if(has('partial1'))return 'partial1';if(has('partials'))return 'partials'}if((t.group||/proyecto/i.test(t.title||''))&&has('projects'))return 'projects';if(/laboratorio/i.test(t.title||'')&&has('labs'))return 'labs';return has('assignments')?'assignments':categories[0].id}
function activityCategory(t){if(t.weight===0||t.type==='Lectura')return 'ungraded';const categories=gradingCategories(t.course);return categories.some(c=>c.id===t.gradeCategory)?t.gradeCategory:guessActivityCategory(t)}
function categoryActivityRows(list){return `<div class="table-wrap"><table class="category-activity-table"><thead><tr><th>ACTIVIDAD</th><th>CALIFICACIÓN</th><th></th></tr></thead><tbody>${list.map(t=>{const receipt=state.receipts[t.id],graded=Number.isFinite(receipt?.grade);return `<tr><td><b>${esc(t.title)}</b><small>${t.weight>0?t.weight+'% del curso':'Sin valor en la nota'}</small></td><td>${t.weight===0?'No aplica':graded?`<b>${receipt.grade}</b> / 100<small>Aporta ${(receipt.grade*t.weight/100).toFixed(2)} puntos</small>`:receipt?'Por calificar':'Sin calificar'}</td><td><button class="text-btn" onclick="openTask(${t.id})">Ver detalle ↗</button></td></tr>`}).join('')}</tbody></table></div>`}
function courseActivityGrades(id){const activities=tasks().filter(t=>t.course===id),categories=[...gradingCategories(id)];if(activities.some(t=>activityCategory(t)==='ungraded'))categories.push({id:'ungraded',name:'Lecturas y actividades sin calificación',weight:0});return `<section class="panel course-activity-grades category-gradebook"><h2>Notas del curso</h2><div class="grade-category-heading"><span>Categoría</span><span>Valor en la nota</span></div>${categories.map(category=>{const list=activities.filter(t=>activityCategory(t)===category.id),expanded=state.gradeCategoryExpanded?.[id+':'+category.id]??list.length>0;return `<details class="grade-category" ${expanded?'open':''} ontoggle="rememberGradeCategory(${id},'${category.id}',this.open)"><summary><span class="grade-category-title">${esc(category.name)}</span><span class="grade-category-weight">${category.weight?category.weight+'%':'No aplica'}</span><span class="category-chevron" aria-hidden="true">⌄</span></summary>${list.length?categoryActivityRows(list):'<p class="category-no-activities">Todavía no hay actividades publicadas en esta categoría.</p>'}</details>`}).join('')}<p class="small muted" style="line-height:1.8;margin-top:15px">Cada categoría muestra su peso en el curso; debajo están sus actividades y calificaciones. Las ponderaciones de la demo se ajustan al programa de cada curso.</p></section>`}
function rememberGradeCategory(id,category,isOpen){state.gradeCategoryExpanded=state.gradeCategoryExpanded||{};state.gradeCategoryExpanded[id+':'+category]=isOpen;save()}
function rememberCourseMaterial(id,isOpen){state.courseMaterialExpanded=state.courseMaterialExpanded||{};state.courseMaterialExpanded[id]=isOpen;save()}
function gradeCategoryOptions(id,selected){return [...gradingCategories(Number(id)),{id:'ungraded',name:'Sin calificación',weight:0}].map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${c.name}${c.weight?' · '+c.weight+'%':''}</option>`).join('')}
function syncActivityCategories(){const id=Number(document.querySelector('#activity-course').value),type=document.querySelector('#activity-type').value,title=document.querySelector('#activity-title').value,group=document.querySelector('#activity-group').checked,weight=Number(document.querySelector('#activity-weight').value);const select=document.querySelector('#activity-category');if(select)select.innerHTML=gradeCategoryOptions(id,guessActivityCategory({course:id,type,title,group,weight},id))}

login();
</script>

  const sharedChat={};
  const fmtTime=iso=>new Date(iso).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Guatemala'});
  const toMsg=r=>({id:'db'+r.id,remoteId:r.id,author:r.author_name,role:r.author_role,initials:r.initials||'',text:r.text,files:r.files||[],time:fmtTime(r.created_at),own:r.author_id===uid});
  async function loadChat(courseId){
    const {data}=await sb.from('chat_messages').select('*').eq('course_id',courseId).order('created_at').limit(300);
    sharedChat[courseId]=(data||[]).map(toMsg);
  }
  const origMessagesFor=window.messagesFor;
  window.messagesFor=function(id){
    if(!uid)return origMessagesFor(id);
    const local=(state.chatMessages?.[id]||[]).filter(m=>!m.remoteId);
    return [...chatSeed(id),...local,...(sharedChat[id]||[])];
  };
  const origSendChat=window.sendChat;
  window.sendChat=async function(){
    const c=selectedChat,before=(state.chatMessages?.[c]||[]).length;
    origSendChat();
    const list=state.chatMessages?.[c]||[];
    if(!uid||list.length===before)return;
    const m=list[list.length-1];
    const {data,error}=await sb.from('chat_messages').insert({course_id:c,author_name:m.author,author_role:['Estudiante','Catedrático','Administración'].includes(m.role)?m.role:'Estudiante',initials:(m.initials||'').slice(0,3),text:m.text||'',files:(m.files||[]).map(f=>({name:f.name}))}).select('*').single();
    if(error){toast('Tu mensaje no se pudo enviar a la clase. Intentá de nuevo.');return}
    m.remoteId=data.id;save();
    sharedChat[c]=sharedChat[c]||[];if(!sharedChat[c].some(x=>x.remoteId===data.id))sharedChat[c].push(toMsg(data));
    render();const feed=document.querySelector('.chat-feed');if(feed)feed.scrollTop=feed.scrollHeight;
  };
  const origOpenClassChat=window.openClassChat;
  window.openClassChat=function(id){origOpenClassChat(id);if(uid)loadChat(Number(id)).then(()=>{if(page==='chat'&&selectedChat===Number(id)){render();const f=document.querySelector('.chat-feed');if(f)f.scrollTop=f.scrollHeight}})};
  function listenChat(){
    sb.channel('chat-clases').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},({new:r})=>{
      sharedChat[r.course_id]=sharedChat[r.course_id]||[];
      if(sharedChat[r.course_id].some(x=>x.remoteId===r.id))return;
      sharedChat[r.course_id].push(toMsg(r));
      if(page==='chat'&&selectedChat===r.course_id&&!document.querySelector('.modal')){
        const input=document.querySelector('#chat-message'),draft=input?.value,focused=document.activeElement===input;
        render();const i2=document.querySelector('#chat-message');if(i2&&draft!=null){i2.value=draft;if(focused)i2.focus()}
        const f=document.querySelector('.chat-feed');if(f)f.scrollTop=f.scrollHeight;
      }
    }).subscribe();
  }

  // ── Calificaciones: el catedrático publica promedios a estudiantes reales ──
  let courseGrades=null;
  async function loadCourseGrades(){const {data}=await sb.from('course_grades').select('student_id,course_id,grade');courseGrades=data||[]}
  const origTeacherGrades=window.teacherGradesView;
  window.teacherGradesView=function(){
    if(!isTeacher)return origTeacherGrades();
    if(!students)loadStudents().then(()=>{if(page==='teacherGrades')render()});
    if(!courseGrades)loadCourseGrades().then(()=>{if(page==='teacherGrades')render()});
    const cid=Number(state.miuGradeCourse)||courses[0].id,c=C(cid);
    const rows=!students||!courseGrades?'<tr><td colspan="3" class="muted">Cargando estudiantes…</td></tr>':students.filter(st=>studentsOf(cid).includes(st.id)).length?students.filter(st=>studentsOf(cid).includes(st.id)).map(st=>{const g=courseGrades.find(x=>x.student_id===st.id&&x.course_id===cid);return `<tr><td>${esc(st.display_name||st.email||'Estudiante')}<br><span class="small muted">${esc(st.email||'')}</span></td><td><input type="number" min="0" max="100" id="grade-${st.id}" aria-label="Promedio de ${esc(st.display_name||st.email||'')} en ${esc(c.name)}" value="${g?g.grade:''}" style="width:70px;padding:8px;border:1px solid var(--line);border-radius:7px"></td><td><button class="text-btn" onclick="miuPublishGrade('${st.id}',${cid})">${g?'Actualizar ↗':'Publicar ↗'}</button></td></tr>`}).join(''):'<tr><td colspan="3" class="muted">Todavía no hay estudiantes inscritos en este curso.</td></tr>';
    return heading('Notas claras y a tiempo.','Publicá el promedio de cada estudiante; lo ve en Mis notas.')+`<div class="notice" style="margin-bottom:20px">Importación desde Google Sheets simulada: no abre ni lee hojas reales.</div><div class="panel"><div class="row between wrap" style="margin-bottom:20px"><h2>Cuadro de calificaciones</h2><div class="row wrap"><label class="small" for="grade-course" style="font-weight:600">Curso</label><select id="grade-course" onchange="state.miuGradeCourse=Number(this.value);save();render()" style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:260px">${courses.map(x=>`<option value="${x.id}" ${x.id===cid?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn secondary" onclick="previewSheets()">${I('drive')}Importar de Sheets · Demo</button></div></div><div class="table-wrap"><table><thead><tr><th>ESTUDIANTE</th><th>PROMEDIO</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  };
  window.miuPublishGrade=async function(studentId,courseId){
    const el=document.querySelector('#grade-'+CSS.escape(studentId)),val=el?.value,n=Number(val);
    if(val===''||!Number.isInteger(n)||n<0||n>100){toast('La nota debe ser un número entero entre 0 y 100.');return}
    const exists=(courseGrades||[]).some(g=>g.student_id===studentId&&g.course_id===courseId);
    const {error}=exists?await sb.from('course_grades').update({grade:n,published_at:new Date().toISOString()}).eq('student_id',studentId).eq('course_id',courseId):await sb.from('course_grades').insert({student_id:studentId,course_id:courseId,grade:n});
    if(error){toast('No se pudo publicar la nota: '+error.message);return}
    await loadCourseGrades();render();toast('Promedio publicado. El estudiante lo ve en Mis notas.');
  };
  // El estudiante recibe sus promedios publicados.
  async function pullCourseGrades(){
    const {data}=await sb.from('course_grades').select('course_id,grade').eq('student_id',uid);
    let changed=false;state.gradeOverrides=state.gradeOverrides||{};
    (data||[]).forEach(g=>{if(state.gradeOverrides[g.course_id]!==g.grade){state.gradeOverrides[g.course_id]=g.grade;changed=true;try{addNotice({key:'grade:'+g.course_id+':'+g.grade,type:'grade',title:'Nueva nota publicada',message:C(g.course_id).name+' · Revisá el detalle en Mis notas.',target:'grades'})}catch{}}});
    if(changed){save();render()}
  }

  // ════════ VERSIÓN COMPLETA ════════
  // ── Cursos e inscripciones reales ──
  let enrollMap={},teacherMap={},catalog=null;
  async function loadCatalog(dbRole){
    const [{data:cs},{data:en},{data:ct}]=await Promise.all([
      sb.from('courses').select('id,data').order('id'),
      sb.from('enrollments').select('user_id,course_id'),
      sb.from('course_teachers').select('course_id,teacher_id')
    ]);
    if(cs&&cs.length){catalog=cs.map(c=>({...c.data,id:c.id}));}
    enrollMap={};(en||[]).forEach(e=>{(enrollMap[e.course_id]=enrollMap[e.course_id]||new Set()).add(e.user_id)});
    teacherMap={};(ct||[]).forEach(e=>{(teacherMap[e.course_id]=teacherMap[e.course_id]||new Set()).add(e.teacher_id)});
    if(!catalog)return;
    let mine=catalog;
    if(dbRole==='estudiante')mine=catalog.filter(c=>enrollMap[c.id]?.has(uid));
    if(dbRole==='catedratico')mine=catalog.filter(c=>teacherMap[c.id]?.has(uid));
    window.miuNoCourses=dbRole!=='administracion'&&!mine.length;
    window.miuCourseIds=dbRole==='administracion'?null:new Set(mine.map(c=>c.id));
    courses.splice(0,courses.length,...(mine.length?mine:catalog));
    if(!courses.some(c=>c.id===activeCourse))activeCourse=courses[0].id;
    if(!courses.some(c=>c.id===selectedChat))selectedChat=courses[0].id;
  }
  const studentsOf=courseId=>[...(enrollMap[courseId]||[])];

  // ── Tareas publicadas por el catedrático → llegan a sus estudiantes ──
  async function loadSharedTasks(){
    const {data}=await sb.from('course_tasks').select('task_id,course_id,data,updated_at');
    const seedIds=new Set([1,2,3,4,5]);
    window.miuSharedEdits={};window.miuSharedNew=[];window.miuSharedIds=new Set();
    (data||[]).forEach(r=>{const t={...r.data,id:Number(r.task_id),course:r.course_id};
      if(seedIds.has(t.id))window.miuSharedEdits[t.id]=t;else{window.miuSharedNew.push(t);window.miuSharedIds.add(t.id)}});
    if(state.role==='Estudiante'){
      state.seenShared=state.seenShared||{};
      (data||[]).forEach(r=>{const v=r.data?.version||1;if(state.seenShared[r.task_id]!==v){state.seenShared[r.task_id]=v;try{addNotice({key:'shared:'+r.task_id+':'+v,type:v>1?'activity-update':'new-activity',taskId:Number(r.task_id),course:r.course_id,title:v>1?'Actividad actualizada':'Nueva actividad publicada',message:(r.data?.title||'Actividad')+' · '+(C(r.course_id)?.name||''),target:'task'})}catch{}}});
      save();
    }
  }
  const origCreateTask=window.createTask;
  window.createTask=async function(){
    const nBefore=state.extraTasks.length,editsBefore=JSON.stringify(state.taskEdits||{});
    origCreateTask();
    if(!isTeacher)return;
    let activity=null;
    if(state.extraTasks.length>nBefore)activity=state.extraTasks[state.extraTasks.length-1];
    else{const now=state.taskEdits||{},prev=JSON.parse(editsBefore);activity=Object.values(now).find(a=>JSON.stringify(a)!==JSON.stringify(prev[a.id]))}
    if(!activity)return;
    const row={course_id:activity.course,data:activity,updated_at:new Date().toISOString()};
    const {data:ex}=await sb.from('course_tasks').select('task_id').eq('task_id',activity.id).maybeSingle();
    const {error}=ex?await sb.from('course_tasks').update(row).eq('task_id',activity.id):await sb.from('course_tasks').insert({task_id:activity.id,...row});
    if(error){toast('No se pudo publicar para tus estudiantes: '+(error.code==='42501'?'no das este curso.':error.message));return}
    await loadSharedTasks();render();
  };

  // ── Archivos subidos de verdad (Storage privado, máx. 10 MB) ──
  window.addFiles=async function(files){
    const t=tasks().find(x=>x.id===currentTask);
    for(const f of files){
      if(f.size>10*1024*1024){toast(f.name+' pesa más de 10 MB.');continue}
      const safe=f.name.normalize('NFD').replace(/[^\w.\-]+/g,'_').slice(-80);
      const path=`${uid}/${t?.course||0}/${currentTask}/${Date.now()}-${safe}`;
      const item={name:f.name,source:'Subiendo…',path};attachments.push(item);attachmentUI();
      const btn=document.querySelector('#submit-task');if(btn)btn.disabled=true;
      const {error}=await sb.storage.from('entregas').upload(path,f,{contentType:f.type||'application/octet-stream'});
      if(error){attachments.splice(attachments.indexOf(item),1);toast('No se pudo subir '+f.name+'. Intentá de nuevo.')}else item.source='Archivo';
      attachmentUI();
    }
  };
  window.miuOpenFile=async function(path){
    const {data,error}=await sb.storage.from('entregas').createSignedUrl(path,300);
    if(error||!data?.signedUrl){toast('No se pudo abrir el archivo.');return}
    window.open(data.signedUrl,'_blank','noopener');
  };

  // ── Asistencia a conferencias: Administración registra, el estudiante la ve ──
  async function pullAttendance(){
    const {data}=await sb.from('conference_attendance').select('event_id,entry_at,exit_at').eq('student_id',uid);
    if(!data?.length)return;
    const t=iso=>iso?new Date(iso).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Guatemala'}):undefined;
    state.conferenceScans=state.conferenceScans||{};
    data.forEach(a=>{state.conferenceScans[a.event_id]={...(state.conferenceScans[a.event_id]||{}),...(a.entry_at?{entry:t(a.entry_at)}:{}),...(a.exit_at?{exit:t(a.exit_at)}:{})}});
    save();render();
  }
  window.miuRegisterAttendance=async function(eventId,kind){
    const sid=document.querySelector('#miu-att-student')?.value;
    if(!sid){toast('Elegí al estudiante.');return}
    const now=new Date().toISOString();
    const {data:ex}=await sb.from('conference_attendance').select('entry_at,exit_at').eq('event_id',eventId).eq('student_id',sid).maybeSingle();
    if(kind==='exit'&&!ex?.entry_at){toast('Primero registrá la entrada.');return}
    if(ex&&ex[kind+'_at']){toast(kind==='entry'?'La entrada ya estaba registrada.':'La salida ya estaba registrada.');return}
    const {error}=ex?await sb.from('conference_attendance').update({[kind+'_at']:now}).eq('event_id',eventId).eq('student_id',sid):await sb.from('conference_attendance').insert({event_id:eventId,student_id:sid,[kind+'_at']:now});
    toast(error?'No se pudo registrar: '+error.message:(kind==='entry'?'Entrada registrada.':'Salida registrada.')+' El estudiante ya la ve en su cuenta.');
  };

  window.enter=async function(){
    const btn=document.querySelector('.google-btn');
    if(btn){btn.disabled=true;btn.lastChild.textContent='Abriendo Google…'}
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error){if(btn){btn.disabled=false;btn.lastChild.textContent='Continuar con Google'}toast('No se pudo abrir Google. Intentá de nuevo.')}
  };
  window.login=function(){
    clearTimeout(syncTimer);uid=null;
    sb.auth.signOut();
    try{localStorage.removeItem(KEY);localStorage.removeItem(OWNER)}catch{}
    showLogin();
  };

  async function start(session){
    const user=session.user;uid=user.id;
    const [{data:profile},{data:remote}]=await Promise.all([
      sb.from('profiles').select('role').eq('id',uid).maybeSingle(),
      sb.from('user_state').select('data').eq('user_id',uid).maybeSingle()
    ]);
    let owner=null,hasLocal=false;
    try{owner=localStorage.getItem(OWNER);hasLocal=!!localStorage.getItem(KEY)}catch{}
    if(owner===uid&&!hasLocal){
      // "Reiniciar demo": se empieza de cero también en la cuenta.
    }else if(remote?.data){
      Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,remote.data);
    }else if(owner&&owner!==uid&&hasLocal){
      // Datos de otra persona en este navegador: empezar limpio.
      try{localStorage.removeItem(KEY);localStorage.setItem(OWNER,uid)}catch{}
      location.reload();return;
    }
    try{localStorage.setItem(OWNER,uid)}catch{}
    const dbRole=profile?.role||'estudiante';
    isAdmin=dbRole==='administracion';
    isTeacher=isAdmin||dbRole==='catedratico';
    window.miuRoleLocked=!isAdmin;
    if(!isAdmin||!remote?.data)state.role=roleLabel(dbRole);
    useProfile(user);
    renameOwnMessages();
    try{await loadCatalog(dbRole);await loadSharedTasks()}catch{}
    save();
    render();
    if(window.miuNoCourses)toast(dbRole==='catedratico'?'Administración todavía no te asignó cursos.':'Administración todavía no te inscribió en cursos.');
    if(dbRole==='estudiante')pullAttendance();
    pullMyGrades();
    if(dbRole==='estudiante')pullCourseGrades();
    listenChat();
    if(page==='chat')loadChat(selectedChat).then(render);
    loadLinks().then(render);
    if(isTeacher)loadSubs().then(()=>{if(page==='teacherTasks')render()});
    if(isAdmin){await loadUsers();if(page==='admin')render()}
  }

  sb.auth.getSession().then(({data})=>{
    const err=new URLSearchParams(location.search).get('error_description');
    if(location.search){history.replaceState(null,'',location.pathname)}
    if(data.session){start(data.session).catch(()=>{toast('No pudimos cargar tu cuenta. Recargá la página.')})}
    else{showLogin();if(err)toast('No pudimos iniciar tu sesión: '+err)}
  });

  // Google Drive real en "Adjuntar desde Google Drive" (si DRIVE está configurado).
  const origDrive=window.drivePicker;
  const loadScript=src=>new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)});
  let driveToken=null;
  window.drivePicker=async function(){
    if(!DRIVE.clientId||!DRIVE.apiKey)return origDrive();
    try{
      await Promise.all([window.gapi?null:loadScript('https://apis.google.com/js/api.js'),window.google?.accounts?null:loadScript('https://accounts.google.com/gsi/client')]);
      await new Promise(r=>gapi.load('picker',r));
      if(!driveToken){
        driveToken=await new Promise((res,rej)=>{
          const client=google.accounts.oauth2.initTokenClient({client_id:DRIVE.clientId,scope:'https://www.googleapis.com/auth/drive.file',login_hint:state.profile?.email,callback:r=>r.error?rej(r):res(r.access_token),error_callback:rej});
          client.requestAccessToken({prompt:''});
        });
        setTimeout(()=>{driveToken=null},50*60*1000);
      }
      const P=google.picker;
      // Mi unidad con carpetas navegables, compartidos, destacados y subir desde la computadora.
      const myDrive=new P.DocsView(P.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false).setParent('root').setMode(P.DocsViewMode.LIST);
      const shared=new P.DocsView(P.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false).setOwnedByMe(false).setMode(P.DocsViewMode.LIST);
      const starred=new P.DocsView(P.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false).setStarred(true).setMode(P.DocsViewMode.LIST);
      const upload=new P.DocsUploadView().setIncludeFolders(true);
      new P.PickerBuilder()
        .addView(myDrive).addView(shared).addView(starred).addView(upload)
        .enableFeature(P.Feature.MULTISELECT_ENABLED).enableFeature(P.Feature.SUPPORT_DRIVES)
        .setTitle('Elegí tus archivos de Google Drive')
        .setOAuthToken(driveToken).setDeveloperKey(DRIVE.apiKey).setAppId(DRIVE.appId).setLocale('es')
        .setCallback(d=>{if(d.action===google.picker.Action.PICKED){d.docs.forEach(doc=>attachments.push({name:doc.name,source:'Google Drive',url:doc.url}));attachmentUI()}})
        .build().setVisible(true);
    }catch(e){driveToken=null;toast('No se pudo abrir Google Drive. Intentá de nuevo.')}
  };
})();
</script></body></html>
