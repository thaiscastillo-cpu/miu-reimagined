function heading(title,sub,action=''){return `<div class="row between page-heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function view(){if(page==='progress')return groupTabs('progress','grades')+gradeView();if(page==='finance')return groupTabs('finance','payments')+paymentsView();if(page==='conferences')return conferenceView();if(page==='chat')return contextBar('Mis cursos','courses',C(selectedChat).name+' · Chat')+chatView();if(page==='pensum')return groupTabs('progress','pensum')+pensumView();if(page==='home')return state.role==='Estudiante'?home():staffHome();if(page==='courses')return courseList();if(page==='course')return courseView();if(page==='tasks')return contextBar('Dashboard','home','Pendientes')+taskList();if(page==='schedule')return contextBar('Dashboard','home','Mi horario')+scheduleView();if(page==='grades')return groupTabs('progress','grades')+gradeView();if(page==='teachers')return teachersView();if(page==='enroll')return enrollView();if(page==='payments')return groupTabs('finance','payments')+paymentsView();if(page==='parking')return groupTabs('finance','parking')+parkingView();if(page==='teacherTasks')return teacherTasksView();if(page==='teacherGrades')return teacherGradesView();if(page==='admin')return adminView();return home()}


function home(){return heading('Hola, '+esc(dashboardFirstName())+'.','Un vistazo a tu día. Y a lo que sigue.',`<span class="today-date">Lunes, 2 de noviembre · Semana de demo</span>`)+`${guideBanner()}<div class="dashboard-status-row">${dashboardChatNotice()}${parkingCounter()}</div><div class="dashboard"><div class="main-col"><button class="course-shortcut" onclick="nav('courses')"><span class="stat-icon">${I('book')}</span><div><b>Mis cursos</b><p>Ingeniería Empresarial · ${courses.length} cursos y workshops</p></div><span class="shortcut-arrow">${I('arrow')}</span></button><details class="dashboard-collapse" ${state.dashboardCollapsed?.tasks?'':'open'} ontoggle="rememberDashboardSection('tasks',this.open)"><summary><h2>Mis pendientes <span class="muted small" style="margin-left:6px">${pending().length}</span></h2><span class="collapse-chevron" aria-hidden="true">⌄</span></summary><div class="dashboard-collapse-body"><div class="collapse-actions"><button class="text-btn" onclick="openPendingTasks()">Ver todo ↗</button></div>${deadlineLegend()}<div class="panel tasks">${pending().length?pending().slice(0,3).map(taskRow).join(''):'<div class="empty">✓ Todo entregado. ¡Buen trabajo!</div>'}</div></div></details></div><aside class="right-col"><div class="panel mini-calendar"><h3 class="row between"><span>‹</span>Noviembre 2026<span>›</span></h3><div class="calendar-grid">${['L','M','M','J','V','S','D'].map(d=>`<span class="day-label">${d}</span>`).join('')}${Array(6).fill('<span></span>').join('')}${Array.from({length:30},(_,i)=>`<span class="${i===1?'selected':[2,3,4,8,10].includes(i)?'event-day':''}">${i+1}</span>`).join('')}</div><button class="text-btn" style="width:100%;margin-top:17px" onclick="calendarSettings()">${state.calendar?'✓ Google Calendar conectado · Demo':'Vincular Google Calendar ↗'}</button><button class="text-btn" style="width:100%" onclick="nav('schedule')">Ver semana ↗</button></div><button class="btn secondary dashboard-week-link" onclick="nav('schedule')">${I('calendar')}Ver semana</button><details class="dashboard-collapse" ${state.dashboardCollapsed?.courses?'':'open'} ontoggle="rememberDashboardSection('courses',this.open)"><summary><h2>Mis cursos</h2><span class="collapse-chevron" aria-hidden="true">⌄</span></summary><div class="dashboard-collapse-body"><div class="collapse-actions"><button class="text-btn" onclick="nav('courses')">Ver todos ↗</button></div>${dashboardCourseLinks()}</div></details></aside></div>`}


function materialDetail(i){if(i===0){showProgram(activeCourse);return}const titles=['Programa del curso','Lectura · Semana 12','Presentación de clase'];openModal(titles[i],'Vista de material de ejemplo',`<div class="rubric"><b>${titles[i]}</b><p>Objetivos: aplicar los conceptos del curso a situaciones prácticas.</p><p>Temas: análisis, interpretación de resultados y discusión de casos.</p><p>Evaluación: revisar los criterios y ponderaciones de cada actividad.</p></div><p class="small muted" style="margin-top:15px">En la plataforma final, este espacio mostraría el documento publicado por el catedrático.</p>`)}
function taskList(){let list=tasks().filter(t=>(filter==='Todos'||filter==='Entregadas'&&state.receipts[t.id]||filter==='Por entregar'&&!state.receipts[t.id]||filter==='Tardías'&&t.late)&&(!search||`${t.title} ${C(t.course).name}`.toLowerCase().includes(search.toLowerCase())));list=orderTasks(list);return heading('Nada se te pasa.','Todos tus cursos. Todas tus entregas. Un solo lugar.',`<button class="btn secondary" onclick="addReminder()">+ Recordatorio</button>`)+`<div class="row between wrap"><div class="tabs">${['Todos','Por entregar','Entregadas','Tardías'].map(f=>`<button class="tab ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><button class="text-btn" onclick="calendarSettings()">${I('calendar')} Google Calendar</button></div>${search?`<p class="muted small" style="margin-bottom:15px">Resultados para “${esc(search)}” <button class="text-btn" onclick="search='';render()">Limpiar</button></p>`:''}${taskOrderControl()}${deadlineLegend()}<div class="panel tasks">${list.length?list.map(taskRow).join(''):'<div class="empty">No hay actividades en esta vista.</div>'}</div><div class="notice" style="margin-top:20px">Las actividades fuera de plazo siguen aceptando entregas. El catedrático verá la marca <b>“Tarde”</b> y aplicará las reglas del curso.</div>${state.reminders?.length?`<section class="panel" style="margin-top:20px"><h2>Mis recordatorios</h2>${reminderRows()}</section>`:''}`}
function openTask(id){state.seenTasks=state.seenTasks||[];if(!state.seenTasks.includes(id))state.seenTasks.push(id);save();currentTask=id;attachments=[];const t=tasks().find(x=>x.id===id),c=C(t.course),r=state.receipts[id];if(r){openModal('Tu entrega quedó registrada.',`${c.name} · ${t.title}`,`<div class="receipt"><b>✓ ${r.late?'Entregada · Tarde':'Entregada a tiempo'}</b><br>Comprobante ${esc(r.code)}<br>Registrada: ${esc(r.time)}<br>Recibida en esta demostración local.</div>${r.grade!==undefined?`<div class="notice" style="margin-top:15px"><b>Calificación: ${r.grade}/100</b><br>${esc(r.feedback||'Sin comentarios adicionales.')}</div>`:''}<h3>Archivos y enlaces</h3>${r.files.map(f=>`<div class="file-row">${I('file')}<span>${esc(f.name)}</span><span class="badge">${esc(f.source)}</span></div>`).join('')}${t.group?groupStatus():''}<p class="small muted" style="margin-top:15px">La demo conserva los nombres de los adjuntos; no envía ni guarda su contenido.</p>`);return}if(t.type==='Examen'||t.type==='Lectura'){openModal(t.title,c.name,`<div class="notice">${esc(t.desc)}</div>${t.rubric?`<div class="rubric" style="margin-top:15px">${taskRubricHTML(t)}</div>`:''}${publishedMaterials(t)}<p style="margin-top:15px" class="small">Fecha: ${esc(t.due)} · Valor: ${t.weight}%</p>`);return}openModal(t.title,`${c.name} · ${t.weight}% de la nota`,`${t.late?'<div class="notice" style="background:#fde7e7;color:#992d2d;border-color:#efc2c2">El plazo terminó. Podés entregar; quedará marcada como <b>Tarde</b>.</div>':''}<p style="font-size:12px;line-height:1.9;margin:15px 0">${esc(t.desc)}</p>${publishedMaterials(t)}<details><summary style="cursor:pointer;font-size:12px;color:var(--purple)">Ver rúbrica · 100 puntos</summary><div class="rubric" style="margin-top:10px">${taskRubricHTML(t)}</div></details><div class="upload-area">${I('upload')}<h3 style="margin:8px 0">Tu trabajo, desde donde estés.</h3><p>Adjuntá varios archivos, fotos, enlaces o documentos de Drive.<br>En esta demo, los archivos permanecen en tu dispositivo.</p><div class="row wrap" style="justify-content:center"><label class="btn secondary" style="cursor:pointer">${I('upload')}Subir archivos<input id="task-files" type="file" multiple style="display:none" onchange="addFiles(this.files)"></label><button class="btn secondary" onclick="drivePicker()">${I('drive')}Google Drive</button><button class="btn secondary" onclick="addLink()">${I('link')}Enlace</button></div></div><div id="attachments"></div>${t.group?`<h3>¿Con quién trabajaste?</h3><p class="small muted">Vos ya figurás en la entrega. Seleccioná a tus compañeros; deberán confirmar.</p>${['Mariana López','Diego Pérez','Valeria Ruiz'].map((n,i)=>`<label class="check-row"><input type="checkbox" name="group" value="${i}">${n}</label>`).join('')}`:''}<div class="field" style="margin-top:15px"><label for="submission-comment">Comentario para el catedrático</label><textarea id="submission-comment" placeholder="Algo que quieras agregar…"></textarea></div>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="submit-task" onclick="submitTask()" disabled>Confirmar entrega ${I('check')}</button>`)}
function attachmentUI(){document.querySelector('#attachments').innerHTML=attachments.map((f,i)=>`<div class="file-row"><span class="row">${I('file')}${esc(f.name)}</span><button aria-label="Quitar ${esc(f.name)}" onclick="attachments.splice(${i},1);attachmentUI()">${I('close')}</button></div>`).join('');document.querySelector('#submit-task').disabled=!attachments.length}
function addFiles(files){for(const f of files)attachments.push({name:f.name,source:'Archivo local'});attachmentUI()}
function drivePicker(){document.querySelector('#drive-picker')?.remove();let d=document.createElement('div');d.id='drive-picker';d.className='notice';d.style.marginTop='15px';d.innerHTML=`<b>Google Drive · Selector simulado</b><p class="small" style="margin:7px 0">Documentos ficticios. No accede a tu cuenta.</p>${['Análisis financiero — documento','Resultados del proyecto — hoja de cálculo','Ensayo de economía — documento'].map(n=>`<button class="file-row" style="width:100%;text-align:left" onclick="selectDrive(this.dataset.name)" data-name="${esc(n)}">${I('drive')}<span>${n}</span><span>+</span></button>`).join('')}<button class="text-btn" onclick="document.querySelector('#drive-picker').remove()">Cerrar selector</button>`;document.querySelector('#attachments').before(d)}
function selectDrive(name){attachments.push({name,source:'Drive · Demo'});document.querySelector('#drive-picker').remove();attachmentUI()}
function addLink(){if(document.querySelector('#link-entry'))return;let d=document.createElement('div');d.id='link-entry';d.className='field';d.innerHTML='<label for="attachment-link">Enlace a tu trabajo</label><div class="row"><input id="attachment-link" type="url" placeholder="https://docs.google.com/…"><button class="btn soft" onclick="commitLink()">Adjuntar</button></div>';document.querySelector('#attachments').before(d)}
function commitLink(){let value=document.querySelector('#attachment-link').value.trim();try{let u=new URL(value);if(!['http:','https:'].includes(u.protocol))throw Error();attachments.push({name:value,source:'Enlace'});document.querySelector('#link-entry').remove();attachmentUI()}catch{toast('Ingresá un enlace que comience con https:// o http://.')}}
function submitTask(){if(!attachments.length)return;const t=tasks().find(t=>t.id===currentTask);let members=[...document.querySelectorAll('input[name="group"]:checked')].map(n=>({id:Number(n.value),name:['Mariana López','Diego Pérez','Valeria Ruiz'][n.value],confirmed:false}));if(t.group&&!members.length){toast('Seleccioná al menos un compañero para la entrega grupal.');return}state.receipts[t.id]={code:'MIU-DEMO-'+String(Date.now()).slice(-6),time:new Date().toLocaleString('es-GT',{timeZone:'America/Guatemala'}),files:[...attachments],late:t.late,comment:document.querySelector('#submission-comment').value,members};save();closeModal();render();openTask(t.id);toast('Entrega registrada. Ya tenés tu comprobante.')}
function groupStatus(){const r=state.receipts[currentTask];return `<h3>Integrantes de la entrega</h3><div class="group-person"><span>Sofía Ortega · Vos</span><span class="badge green">Confirmada</span></div>${r.members.map((m,i)=>`<div class="group-person"><span>${esc(m.name)}</span>${m.confirmed?'<span class="badge green">Confirmada</span>':`<button class="btn soft" onclick="confirmMember(${i})">Simular confirmación</button>`}</div>`).join('')}<p class="small muted" style="margin-top:10px">En la versión final, cada integrante confirmaría desde su propia cuenta.</p>`}
function confirmMember(i){state.receipts[currentTask].members[i].confirmed=true;save();openTask(currentTask)}
function teachersView(){let list=teachers.map((t,i)=>({...t,i})).filter(t=>!search||`${t.name} ${t.area}`.toLowerCase().includes(search.toLowerCase()));return heading('Elegí con más contexto.','Conocé la metodología, carga y experiencias de cada catedrático.')+`<div class="notice" style="margin-bottom:23px">Perfiles y reseñas ficticios para demostrar la experiencia. Las reseñas se centran en la experiencia académica.</div><div class="row between wrap" style="margin-bottom:23px"><form class="row" onsubmit="event.preventDefault();search=this.teacher.value;render()"><input aria-label="Buscar catedráticos" name="teacher" value="${esc(search)}" placeholder="Nombre o área académica" style="padding:11px 15px;border:1px solid var(--line);border-radius:9px"><button class="btn secondary">Buscar</button></form><span class="small muted">${list.length} catedráticos · Datos de ejemplo</span></div><div class="teacher-grid">${list.map(t=>`<article class="panel teacher-card"><div class="row between"><div class="avatar">${t.initials}</div><span class="badge orange">★ ${t.rating}</span></div><h3>${t.name}</h3><span class="small muted">${t.area}</span><p>${t.bio}</p><div class="teacher-tags">${t.tags.map(s=>`<span class="badge">${s}</span>`).join('')}</div><p>${I('clock')} ${t.load}</p><div class="teacher-rating"><span>${t.n} reseñas de ejemplo</span><span class="rating">Claridad ${t.clarity}/5</span></div><button class="btn secondary" onclick="teacherDetail(${t.i})">Ver perfil y reseñas ${I('arrow')}</button></article>`).join('')}</div>${!list.length?'<div class="empty">No encontramos catedráticos con esa búsqueda.</div>':''}`}
function teacherDetail(i){let t=teachers[i];openModal(t.name,`${t.area} · Perfil ficticio`, `<div class="row"><div class="avatar" style="width:60px;height:60px;font-size:20px">${t.initials}</div><div><span class="rating">★ ${t.rating} / 5</span><p class="small muted" style="margin-top:6px">${t.n} reseñas de ejemplo · No corresponden a personas reales</p></div></div><p style="margin:20px 0;font-size:13px;line-height:1.8">${t.bio}</p><div class="rubric"><b>Cómo se vive su clase</b><br>Metodología: ${t.tags.join(' · ')}<br>Carga estimada: ${t.load}<br>Evaluación: ${t.evaluation}<br>Claridad: ${t.clarity}/5</div><h3>Experiencias de estudiantes</h3>${t.reviews.map((r,j)=>`<div class="review"><div class="row between"><span class="badge green">Curso completado · Ejemplo</span><span class="small muted">${j?'2026-1':'2025-2'}</span></div><p>${r}</p></div>`).join('')}${state.reviews.filter(r=>r.teacher===i).map(r=>`<div class="review"><span class="badge">Tu reseña de demostración · ${r.rating}/5</span><p>${esc(r.text)}</p></div>`).join('')}${linkedinButton(i)}<button class="text-btn" onclick="reviewForm(${i})">Escribir una reseña de ejemplo ↗</button>`, `<button class="btn secondary" onclick="closeModal()">Cerrar</button><button class="btn" onclick="closeModal();nav('enroll')">Ver secciones disponibles ${I('arrow')}</button>`)}

function linkedinButton(i){const url=state.linkedin?.[i];return '<div style="margin:18px 0;padding-top:15px;border-top:1px solid var(--line)">'+(url?'<a class="btn secondary" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">LinkedIn · Ver perfil ↗</a>':'<button class="btn secondary" onclick="configureLinkedin('+i+')">LinkedIn · Agregar perfil</button>')+'<p class="small muted" style="margin-top:9px">'+(url?'Enlace configurado en esta demo.':'Pendiente de un enlace real. Este catedrático es un perfil de ejemplo.')+'</p>'+(url?'<button class="text-btn" onclick="configureLinkedin('+i+')">Editar enlace</button>':'')+'</div>'}
function configureLinkedin(i){openModal('Perfil de LinkedIn',teachers[i].name+' · Enlace de demostración','<div class="notice">Pegá el enlace del catedrático que querés representar. No se inventa ni se asigna un perfil real automáticamente.</div><form onsubmit="event.preventDefault();saveLinkedin('+i+')"><div class="field" style="margin-top:20px"><label for="linkedin-url">URL del perfil</label><input id="linkedin-url" type="url" required placeholder="https://www.linkedin.com/in/…" value="'+esc(state.linkedin?.[i]||'')+'"></div><button class="btn">Guardar enlace</button></form>')}
function saveLinkedin(i){let value=document.querySelector('#linkedin-url').value.trim();try{const u=new URL(value);if(u.protocol!=='https:'||!(u.hostname==='linkedin.com'||u.hostname.endsWith('.linkedin.com'))||!/^\/in\/[^/]+/.test(u.pathname))throw Error();state.linkedin=state.linkedin||{};state.linkedin[i]=u.href;save();teacherDetail(i);toast('Enlace guardado. El botón abre el perfil en otra pestaña.')}catch{toast('Usá un enlace de perfil: https://www.linkedin.com/in/nombre')}}

function reviewForm(i){openModal('Compartí tu experiencia','Reseña local de demostración. No se publica.',`<div class="notice">Comentá sobre claridad, metodología, evaluación y carga de trabajo. Para una plataforma real, proponemos reseñas de estudiantes que completaron el curso y revisión de reportes.</div><div class="field" style="margin-top:20px"><label for="review-rating">Valoración general</label><select id="review-rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} / 5</option>`).join('')}</select></div><div class="field"><label for="review-text">Tu experiencia académica</label><textarea id="review-text" maxlength="800" placeholder="¿Qué le serviría saber a otro estudiante?"></textarea></div>`,`<button class="btn" onclick="saveReview(${i})">Guardar reseña de ejemplo</button>`)}
function saveReview(i){let text=document.querySelector('#review-text').value.trim();if(text.length<10){toast('Contanos un poco más: al menos 10 caracteres.');return}state.reviews.push({teacher:i,rating:document.querySelector('#review-rating').value,text});save();teacherDetail(i);toast('Reseña guardada solo en tu demo.')}
function contactTeacher(i){let t=teachers[i];openModal('Contacto y atención',t.name,`<div class="rubric">Correo institucional: <b>docente.ejemplo@universidad.example</b><br>Atención: miércoles, 14:00–15:00<br>Ubicación: oficina académica · Ejemplo</div><p class="small muted" style="margin-top:15px">Datos de contacto ficticios para la presentación.</p>`)}
function scheduleView(){return heading('Tu semana, de un vistazo.','Semana de demostración · 2 al 6 de noviembre de 2026',`<button class="btn secondary" onclick="calendarSettings()">${I('calendar')}${state.calendar?'Calendar · Demo':'Vincular Calendar'}</button>`)+`<div class="panel table-wrap"><div class="schedule"><div></div>${['Lunes 2','Martes 3','Miércoles 4','Jueves 5','Viernes 6'].map(d=>`<div class="sched-head">${d}</div>`).join('')}${[8,10,11,14].map((hour,r)=>`<div class="sched-time">${hour===11?'11:30':hour+':00'}</div>${Array.from({length:5},(_,d)=>{let c=r===0&&[0,2].includes(d)?courses[0]:r===1&&[1,3].includes(d)?courses[1]:r===2&&[0,2].includes(d)?courses[2]:null;return c?`<button class="cell class-cell ${r===1?'blue':r===2?'peach':''}" onclick="activeCourse=${c.id};nav('course')"><strong>${c.name}</strong>${c.room}<br>Sección ${c.section}</button>`:'<div class="cell"></div>'}).join('')}`).join('')}</div></div><div class="notice" style="margin-top:20px">Además del horario, tu calendario puede reunir tareas, exámenes, lecturas y recordatorios personales. La conexión con Google se representa de forma simulada.</div>`}
function calendarSettings(){openModal('Tu agenda también en Google.','Google Calendar institucional · Conexión simulada',`<div class="notice">Esta demo no solicita permisos de Google ni crea eventos o notificaciones reales.</div><h3>¿Qué querés ver en tu calendario?</h3>${['Horario de clases','Tareas y proyectos','Exámenes y lecturas','Recordatorios personales'].map((t,i)=>`<label class="check-row"><input type="checkbox" name="calendar-kind" value="${i}" ${!state.calendarKinds||state.calendarKinds.includes(String(i))?'checked':''}>${t}</label>`).join('')}<h3>Notificaciones al teléfono</h3><label class="check-row"><input id="push-notify" type="checkbox" ${state.notify?'checked':''}>Recordar 24 horas y 1 hora antes de una entrega</label><label class="check-row"><input type="checkbox" checked disabled>Avisar cuando cambie una fecha</label>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="state.calendar=true;state.notify=document.querySelector('#push-notify').checked;state.calendarKinds=[...document.querySelectorAll('input[name=calendar-kind]:checked')].map(x=>x.value);save();closeModal();render();toast('Preferencias guardadas. Conexión simulada.')">Guardar conexión de demo</button>`)}
function currentSemesterGradeView(){return heading('Así vas en el semestre.','Promedio ponderado por UMA · Calificaciones ilustrativas para la demo.')+`<div class="stat-row grade-summary" style="margin-bottom:24px"><div class="stat"><div><b>${average()}</b><span>Promedio ponderado por UMA</span></div></div><div class="stat"><div><b>${totalUMA()}</b><span>UMA inscritas</span></div></div></div><div class="notice" style="margin-bottom:20px"><b>¿Cómo se calcula?</b><br>Σ (nota del curso × UMA del curso) ÷ Σ UMA de cursos con nota.</div><div class="panel table-wrap">${gradeSemesterSelector()}<table><thead><tr><th>CURSO / AUXILIAR</th><th>UMA</th><th>NOTA ACTUAL</th><th>NOTA × UMA</th><th>DETALLE</th></tr></thead><tbody>${courses.map(c=>{const g=gradeFor(c.id);return `<tr><td><b>${c.name}</b><br><span class="muted small">${teachers[c.teacher].name} · Ejemplo<br>Auxiliar: ${esc(auxFor(c.id))}</span></td><td><span class="badge">${c.credits} UMA</span></td><td>${Number.isFinite(g)?`<b style="font-size:20px">${g}</b><span class="muted"> / 100</span>`:'<span class="badge orange">Pendiente</span>'}</td><td>${Number.isFinite(g)?(g*c.credits).toFixed(2):'—'}</td><td><button class="text-btn" onclick="gradeDetail(${c.id})">Ver desglose ↗</button></td></tr>`}).join('')}</tbody></table></div><div class="panel" style="margin-top:20px"><h2>Los workshops también cuentan</h2><p class="small muted" style="margin-top:12px;line-height:1.8">Cada workshop aporta 0.5 UMA al promedio ponderado cuando se publica su nota. Ambos están pendientes en esta demo y no se toman como cero.</p></div><div class="notice" style="margin-top:20px">Los nombres de los catedráticos y las notas siguen siendo ficticios. Los nombres de auxiliares están por confirmar. La importación de Sheets continúa simulada.</div>`}

function gradeDetail(id){let c=C(id),g=gradeFor(id);if(!Number.isFinite(g)){openModal('Nota pendiente · '+c.name,c.credits+' UMA', '<div class="notice">Todavía no hay una calificación numérica para este curso. No se incluye en el promedio ponderado hasta que se publique.</div>');return}openModal('Tus notas · '+c.name,'Desglose de ejemplo · Última publicación: 2 nov 2026',`<div class="table-wrap"><table><thead><tr><th>Actividad</th><th>Peso</th><th>Nota</th><th>Aporte</th></tr></thead><tbody>${[['Primer parcial',20,g],['Segundo parcial',20,g],['Exámenes cortos',15,g],['Entregables',15,g],['Examen final',30,null]].map(([n,p,v])=>`<tr><td>${n}</td><td>${p}%</td><td>${v===null?'Pendiente':v+'/100'}</td><td>${v===null?'—':(v*p/100).toFixed(1)}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:15px">Promedio de lo evaluado: <b>${g}/100</b>. Acumulado: <b>${(g*.7).toFixed(1)}/70</b>. El final pendiente no se cuenta como cero.</div><h3>¿Cuánto necesitás en el final?</h3><div class="field"><label for="target-grade">Meta de nota final</label><input id="target-grade" type="number" min="0" max="100" value="${g}" oninput="calculateFinal(${g})"></div><p id="final-result" class="small muted">Para terminar con ${g}, necesitás ${g} en el final.</p>`)}
function calculateFinal(g){let v=Number(document.querySelector('#target-grade').value);let need=(v-g*.7)/.3;document.querySelector('#final-result').textContent=v<0||v>100?'Ingresá una meta entre 0 y 100.':need>100?'Esta meta supera lo posible con la ponderación actual.':need<=0?'Ya alcanzaste esa meta con lo acumulado.':`Necesitás al menos ${need.toFixed(1)}/100 en el final.`}



function paymentsView(){return heading('Tus pagos, sin vueltas.','Saldo universitario y movimientos de ejemplo.')+`<div class="two-col"><div class="panel"><span class="eyebrow muted">SALDO PENDIENTE</span><h2 style="font-size:40px;margin:18px 0">Q ${state.balance.toLocaleString('es-GT',{minimumFractionDigits:2})}</h2><p class="small muted">Cuota del semestre · Vencimiento de ejemplo: 5 nov 2026</p><button class="btn" style="margin-top:25px" ${!state.balance?'disabled':''} onclick="paymentConfirm()">${state.balance?'Simular pago de universidad':'✓ Saldo al día'}</button></div><div class="panel"><h2>Movimientos</h2>${state.paid?'<div class="file-row"><span>Pago universitario · Q 3,850.00</span><span class="badge green">Simulado</span></div>':'<p class="small muted" style="margin-top:20px">Tu pago aparecerá aquí con su comprobante.</p>'}<div class="notice" style="margin-top:22px">No se solicitan tarjetas ni datos bancarios. No se procesa ningún cobro real.</div></div></div>`}
function paymentConfirm(){openModal('Revisá tu pago de ejemplo','Universidad · Simulación',`<div class="rubric">Concepto: cuota universitaria<br>Total: <b>Q ${state.balance.toLocaleString('es-GT',{minimumFractionDigits:2})}</b><br>Medio: cuenta de prueba</div><p class="small muted" style="margin-top:18px">Esta operación no mueve dinero.</p>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="state.balance=0;state.paid=true;save();closeModal();render();toast('Pago simulado · Comprobante MIU-PAGO-DEMO.')">Confirmar simulación</button>`)}
function parkingView(){return heading('Tu entrada al campus.','Elegí entradas por paquete o un pase semestral.')+`<div class="panel" style="margin-bottom:22px"><div class="row between"><div><span class="eyebrow muted">TU PARQUEO</span><h2 style="font-size:38px;margin-top:10px">${state.park} <span class="muted" style="font-size:14px;font-weight:400">entradas disponibles</span></h2></div>${I('car')}</div>${state.semester?'<span class="badge green" style="margin-top:15px">Pase semestral activo · Demo</span>':''}</div><div class="teacher-grid">${[[10,150],[25,325],['Semestral',1200]].map(([n,price])=>`<div class="panel"><span class="badge">${n==='Semestral'?'ACCESO DEL SEMESTRE':'PAQUETE DE ENTRADAS'}</span><h2 style="font-size:26px;margin:20px 0 10px">${n==='Semestral'?'Pase semestral':n+' entradas'}</h2><p class="muted small">Tarifa ilustrativa · No oficial</p><h3 style="margin-top:20px">Q ${price.toLocaleString()}</h3><button class="btn secondary" style="margin-top:18px;width:100%" onclick="buyParking('${n}',${price})">Simular compra</button></div>`).join('')}</div>`}
function buyParking(n,p){openModal('Confirmá tu parqueo',n==='Semestral'?'Pase semestral':n+' entradas',`<div class="notice">Total ilustrativo: <b>Q ${p.toLocaleString()}</b><br>Esta compra solo actualiza tu demo. No mueve dinero.</div>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="${n==='Semestral'?'state.semester=true':'state.park+='+Number(n)};save();closeModal();render();toast('Compra simulada. Tu parqueo está actualizado.')">Confirmar compra simulada</button>`)}
function staffHome(){let teacher=state.role==='Catedrático';return heading(teacher?'Buen día, '+esc(state.profile?.given_name||'Elena')+'.':'Tu universidad, en perspectiva.',teacher?'Publicá, revisá y acompañá el avance de tus estudiantes.':'Gestioná la oferta académica y los turnos de asignación.')+`<div class="hero" style="margin-bottom:25px"><div><span class="eyebrow" style="color:#b76868">${teacher?'ESPACIO DOCENTE':'GESTIÓN ACADÉMICA'}</span><h2 style="margin-top:12px">${teacher?'Todo listo para tu próxima clase.':'Más claridad en cada asignación.'}</h2><p>${teacher?'Una estructura común para publicar tareas y revisar entregas, también desde el teléfono.':'Cupos visibles, turnos claros y confirmaciones para cada estudiante.'}</p><button class="btn" onclick="nav('${teacher?'teacherTasks':'admin'}')">${teacher?'Gestionar tareas':'Ver cursos y cupos'} ${I('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="tile">${I(teacher?'book':'settings')}<i></i><i></i><i></i></div><div class="check">${I('check')}</div></div></div><div class="stat-row"><div class="stat"><div><b>${courses.length.toString().padStart(2,'0')}</b><span>Cursos y workshops</span></div></div><div class="stat"><div><b>${Object.keys(state.receipts).length.toString().padStart(2,'0')}</b><span>Entregas en esta demo</span></div></div><div class="stat"><div><b>${state.assignments.length.toString().padStart(2,'0')}</b><span>Asignaciones simuladas</span></div></div></div><div class="notice" style="margin-top:24px">${window.miuRoleLocked?'Tu rol lo asigna Administración. Los datos de cursos y entregas son de demostración.':'Podés cambiar entre los tres roles desde el selector superior. Los permisos y acciones representan recorridos de demostración; no son controles de acceso reales.'}</div>`}



function reviewSubmission(id){const t=tasks().find(t=>t.id===id),r=state.receipts[id];openModal(t.title,'Revisión docente · Datos de ejemplo',r?`<div class="receipt"><b>${r.late?'Recibida · Tarde':'Recibida a tiempo'}</b><br>Sofía Ortega · ${esc(r.time)}<br>${esc(r.code)}</div><h3>Adjuntos</h3>${r.files.map(f=>`<div class="file-row"><span>${esc(f.name)}</span><span class="badge">${esc(f.source)}</span></div>`).join('')}<p class="small muted" style="margin:15px 0">La demo solo conserva los nombres. No abre el contenido de archivos ni accede a Drive.</p>${t.group?`<h3>Integrantes</h3><div class="rubric">Sofía Ortega · Confirmada<br>${r.members.map(m=>`${esc(m.name)} · ${m.confirmed?'Confirmada':'Pendiente'}`).join('<br>')}</div>`:''}<p class="small" style="margin-top:15px"><b>Comentario:</b> ${esc(r.comment||'Sin comentario')}</p><div class="field" style="margin-top:20px"><label for="submission-grade">Calificación (0–100)</label><input id="submission-grade" type="number" min="0" max="100" value="${r.grade??''}"></div><div class="field"><label for="submission-feedback">Retroalimentación</label><textarea id="submission-feedback">${esc(r.feedback||'')}</textarea></div>`:'<div class="empty">Todavía no hay una entrega. Cambiá al rol Estudiante y entregá esta actividad para probar el recorrido completo.</div>',r?`<button class="btn" onclick="saveSubmissionGrade(${id})">Guardar revisión</button>`:'')}
function saveSubmissionGrade(id){let val=document.querySelector('#submission-grade').value,n=Number(val);if(val===''||n<0||n>100){toast('Ingresá una nota de 0 a 100.');return}state.receipts[id].grade=n;state.receipts[id].feedback=document.querySelector('#submission-feedback').value;save();closeModal();toast('Revisión guardada para esta entrega de demostración.')}
function teacherGradesView(){return heading('Notas claras y a tiempo.','Publicá promedios de ejemplo o previsualizá una importación.')+`<div class="notice" style="margin-bottom:20px">Importación desde Google Sheets simulada: no abre ni lee hojas reales.</div><div class="panel"><div class="row between wrap" style="margin-bottom:20px"><h2>Cuadro de calificaciones</h2><button class="btn secondary" onclick="previewSheets()">${I('drive')}Importar de Sheets · Demo</button></div><div class="table-wrap"><table><thead><tr><th>ESTUDIANTE</th><th>CURSO</th><th>PROMEDIO</th><th></th></tr></thead><tbody>${courses.map(c=>`<tr><td>Sofía Ortega · Ejemplo</td><td>${c.name}</td><td><input type="number" min="0" max="100" id="grade-${c.id}" aria-label="Promedio ${c.name}" value="${gradeFor(c.id)??''}" style="width:70px;padding:8px;border:1px solid var(--line);border-radius:7px"></td><td><button class="text-btn" onclick="publishGrade(${c.id})">Publicar ↗</button></td></tr>`).join('')}</tbody></table></div></div>`}
function publishGrade(id){let v=Number(document.querySelector('#grade-'+id).value);if(v<0||v>100||document.querySelector('#grade-'+id).value===''){toast('La nota debe estar entre 0 y 100.');return}state.gradeOverrides=state.gradeOverrides||{};state.gradeOverrides[id]=v;save();addNotice({key:'grade:'+id+':'+v+':'+Date.now(),type:'grade',title:'Nueva nota publicada',message:C(id).name+' · Revisá el detalle en Mis notas.',target:'grades'});toast('Promedio publicado en Mis notas del estudiante · Demo.')}
function previewSheets(){openModal('Previsualización de importación','Hoja ficticia · Notas del semestre',`<div class="rubric">Sofía Ortega · Contabilidad Financiera · 86<br>Sofía Ortega · Economía II · 92<br>Sofía Ortega · Cálculo Diferencial · 89</div><p class="small muted" style="margin-top:15px">Se reemplazarán los tres promedios de ejemplo. No se accede a Google Sheets.</p>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="state.gradeOverrides={1:86,2:92,3:89};save();closeModal();render();toast('Importación simulada publicada.')">Confirmar importación de ejemplo</button>`)}
function adminView(){return heading('Oferta académica, en orden.','Configuración de cupos y prioridad para la demostración.')+`<div class="two-col"><div class="panel"><h2>Cursos y secciones</h2><div class="table-wrap"><table><thead><tr><th>CURSO</th><th>SECCIÓN</th><th>CUPOS BASE</th><th>AUXILIAR</th><th>CORREOS</th></tr></thead><tbody>${courses.map((c,i)=>`<tr><td>${c.name}</td><td>${c.section}</td><td>${i===0?`<input id="capacity" type="number" min="0" max="50" value="${state.adminCapacity}" aria-label="Cupos de Contabilidad" style="padding:8px;width:65px;border:1px solid var(--line);border-radius:7px">`:c.capacity}</td><td><input id="course-aux-${c.id}" aria-label="Auxiliar de ${c.name}" value="${esc(auxFor(c.id)==='Por confirmar'?'':auxFor(c.id))}" placeholder="Nombre por confirmar" style="padding:9px;width:190px;border:1px solid var(--line);border-radius:7px"></td><td><button class="text-btn" onclick="editCourseEmails(${c.id})">Editar correos ↗</button></td></tr>`).join('')}</tbody></table></div><button class="btn" style="margin-top:20px" onclick="saveAdmin()">Guardar cursos y auxiliares</button></div><div class="panel"><h2>Turno de asignación</h2><p class="small muted" style="line-height:1.8;margin:15px 0">La pertenencia a cuadro de honor determina el turno del perfil de ejemplo.</p><label class="check-row"><input type="checkbox" ${state.honor?'checked':''} onchange="state.honor=this.checked;save();toast('Turno del perfil de ejemplo actualizado.')">Sofía pertenece a cuadro de honor</label><div class="rubric" style="margin-top:20px">1. Cuadro de honor · Turno prioritario<br>2. Turno general<br>3. Confirmación individual de sección</div></div></div>`}
function saveAdmin(){let val=document.querySelector('#capacity').value,n=Number(val);if(val===''||!Number.isInteger(n)||n<0||n>50){toast('Ingresá un número entero entre 0 y 50.');return}state.adminCapacity=n;state.auxNames=Object.fromEntries(courses.map(c=>[c.id,document.querySelector('#course-aux-'+c.id).value.trim()]));save();toast('Cupos y auxiliares actualizados en la demo.')}



function globalSearch(q){q=q.trim();if(!q)return;search=q;const matchingCourse=courses.find(c=>c.name.toLowerCase().includes(q.toLowerCase()));const matchingTeacher=teachers.some(t=>(t.name+' '+t.area).toLowerCase().includes(q.toLowerCase()));if(matchingTeacher)page='teachers';else if(matchingCourse){activeCourse=matchingCourse.id;page='course'}else page='tasks';render()}
function openModal(title,subtitle,body,footer=''){if(!document.querySelector('.modal'))modalReturnFocus=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="row between modal-header"><div><h2 id="modal-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon-btn" aria-label="Cerrar ventana" onclick="closeModal()">${I('close')}</button></div>${body}${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.modal').focus()}
function closeModal(){document.querySelector('#modal-root').innerHTML='';document.body.style.overflow='';modalReturnFocus?.focus?.()}
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const nodes=[...m.querySelectorAll('button,input,textarea,select,a[href],summary,[tabindex="0"]')].filter(n=>!n.disabled&&n.offsetParent!==null);let first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===m)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function toggleMobile(){mobile=!mobile;document.body.classList.toggle('mobile-mode',mobile);render()}
function resetDemo(){openModal('¿Reiniciar la demostración?','Solo borra los cambios locales de este prototipo.',`<p class="small muted">Se restablecerán entregas, notas, compras simuladas, reseñas y asignaciones.</p>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="try{localStorage.removeItem('miu-demo-v2')}catch{}location.reload()">Reiniciar demo</button>`)}
const conferenceEvents=[
 {id:'economia',title:'Decisiones e incentivos en la economía actual',speaker:'Conferencista invitado · Ejemplo',area:'Facultad · Economía',date:'30 oct 2026 · 16:00',room:'Auditorio · Ejemplo',course:2,code:'ECON26',upcoming:false,desc:'Una conversación sobre cómo los incentivos transforman las decisiones individuales y de las organizaciones.'},
 {id:'tecnologia',title:'Inteligencia artificial y criterio profesional',speaker:'Panel de expertos · Ejemplo',area:'Tecnología y negocios',date:'2 nov 2026 · 14:00',room:'Auditorio · Ejemplo',course:4,code:'IA2026',upcoming:false,desc:'Reflexiones sobre el uso de inteligencia artificial en el trabajo y el aprendizaje universitario.'},
 {id:'liderazgo',title:'Liderazgo y equipos que aprenden',speaker:'Conferencista invitado · Ejemplo',area:'Vida universitaria',date:'6 nov 2026 · 15:00',room:'Auditorio · Ejemplo',course:7,code:'LIDERA',upcoming:true,desc:'Cómo construir equipos que compartan conocimiento y colaboren con propósito.'}
];
icons.chat='<path d="M4 4h16v12H9l-5 4Z"/><path d="M8 8h8M8 12h5"/>';
let selectedChat=1,chatQuery='',chatDrafts={},chatFiles={},threadFiles=[],threadTarget=null;

function conferenceInfo(id){const e=conferenceEvents.find(e=>e.id===id);openModal(e.title,'Próxima conferencia · Ejemplo',`<div class="rubric">${e.date}<br>${e.room}<br>${e.speaker}</div><p class="small muted" style="margin-top:18px;line-height:1.8">La evaluación se habilitará después de la conferencia. El código de asistencia se proporciona durante el evento.</p>`)}


function conferenceReceipt(id){const e=conferenceEvents.find(e=>e.id===id),r=state.conferenceEvaluations[id];openModal('Tu participación quedó registrada.',e.title,`<div class="receipt"><b>✓ Asistencia validada · Evaluación recibida</b><br>Comprobante: ${esc(r.code)}<br>Registrado: ${esc(r.time)}<br>Sofía Ortega · Cuenta de ejemplo</div><div class="rubric" style="margin-top:18px"><b>Seguimiento académico</b><br>Actividad: ${e.title}<br>Curso relacionado: ${C(e.course).name}<br>Requisito de participación: completado en la demo<br>Equivalencia: 30 asistencias = 1 UMA<br>Asistencias acumuladas de demo: ${conferenceCount()}<br>UMA completadas por conferencias: ${conferenceCredits()}</div><p class="small muted" style="margin-top:18px;line-height:1.8">Este es un comprobante local de demostración. No registra asistencia en los sistemas de la universidad. Tu valoración no aparece en este comprobante.</p>`)}
function chatSeed(id){const c=C(id);return [{id:'welcome-'+id,author:teachers[c.teacher].name,role:'Catedrático · Ejemplo',initials:teachers[c.teacher].initials,text:'¡Bienvenidos al espacio de '+c.name+'! Usemos este chat para dudas del curso y avisos que le sirven a toda la clase.',time:'08:05',pinned:true,files:[]},{id:'question-'+id,author:'Mariana López',role:'Estudiante · Ejemplo',initials:'ML',text:'¿Podemos compartir aquí las dudas sobre la próxima entrega? @catedrático',time:'08:12',files:[]},{id:'aux-'+id,author:auxFor(id)==='Por confirmar'?'Auxiliar del curso':auxFor(id),role:'Auxiliar · Ejemplo',initials:'AX',text:'¡Sí! Pueden responder en un hilo para mantener juntas las preguntas sobre el mismo tema. También pueden adjuntar archivos.',time:'08:18',files:[]}];}
function messagesFor(id){return [...chatSeed(id),...(state.chatMessages?.[id]||[])]}
function threadKey(course,id){return course+':'+id}
function formatChat(text){return esc(text).replace(/(@[\p{L}\p{N}_]+)/gu,'<span class="mention">$1</span>')}
function chatIdentity(){return state.role==='Catedrático'?{author:'Elena Morales',role:'Catedrático · Demo',initials:'EM'}:state.role==='Administración'?{author:'Administración',role:'Administración · Demo',initials:'AD'}:{author:'Sofía Ortega',role:'Estudiante · Demo',initials:'SO'}}

function openClassChat(id){selectedChat=Number(id);chatQuery='';nav('chat')}
function chatView(){const c=C(selectedChat),messages=messagesFor(c.id).filter(m=>!chatQuery||`${m.author} ${m.text} ${(m.files||[]).map(f=>f.name).join(' ')}`.toLowerCase().includes(chatQuery.toLowerCase()));return heading('La conversación sigue aquí.','Un espacio por clase para estudiantes, catedrático y auxiliar.')+`<div class="chat-shell"><aside class="chat-channels"><p class="eyebrow muted" style="padding:0 10px;margin-bottom:12px">TUS ESPACIOS DE CLASE</p>${courses.map(course=>`<button class="channel ${course.id===c.id?'selected':''}" onclick="selectChat(${course.id})"><span class="channel-symbol">#</span><span><b>${course.name}</b><small>Sección ${course.section}</small></span></button>`).join('')}</aside><section class="chat-conversation"><header class="chat-header"><div><h2># ${c.name}</h2><p class="small muted" style="margin-top:6px">Sección ${c.section} · Estudiantes, catedrático y auxiliar</p></div><button class="icon-btn" aria-label="Ver participantes del chat" onclick="chatParticipants(${c.id})">${I('users')}</button></header><div class="chat-mobile-selector"><label for="mobile-channel" class="small muted">Cambiar clase</label><select id="mobile-channel" onchange="selectChat(this.value)">${courses.map(course=>`<option value="${course.id}" ${course.id===c.id?'selected':''}>${course.name}</option>`).join('')}</select></div><form class="chat-search" onsubmit="event.preventDefault();chatQuery=this.query.value.trim();render()">${I('search')}<input name="query" aria-label="Buscar mensajes en esta clase" placeholder="Buscar en esta conversación" value="${esc(chatQuery)}"><button class="text-btn">Buscar</button>${chatQuery?'<button type="button" class="text-btn" onclick="chatQuery=\'\';render()">Limpiar</button>':''}</form><div class="chat-feed" role="log" aria-label="Mensajes de la clase">${messages.length?messages.map(m=>chatMessage(c.id,m)).join(''):'<div class="empty">No encontramos mensajes con esa búsqueda.</div>'}</div><form class="chat-composer" onsubmit="event.preventDefault();sendChat()"><div class="chat-draft-files">${(chatFiles[c.id]||[]).map((f,i)=>`<span class="badge">${esc(f.name)}<button type="button" aria-label="Quitar adjunto ${esc(f.name)}" onclick="removeChatFile(${i})">×</button></span>`).join('')}</div><label class="sr-only" for="chat-message">Mensaje para ${c.name}</label><textarea id="chat-message" placeholder="Escribí a tu clase… usá @ para mencionar" maxlength="4000" oninput="chatDrafts[${c.id}]=this.value">${esc(chatDrafts[c.id]||'')}</textarea><div class="row between wrap"><div class="row"><label class="btn secondary attach-chat">${I('file')}Archivos<input type="file" multiple hidden onchange="attachChatFiles(this.files)"></label><button type="button" class="btn secondary" onclick="mentionMenu()">@ Mencionar</button></div><button class="btn">Enviar ${I('arrow')}</button></div><p class="small muted" style="margin-top:10px;font-size:10px">Demo local: los mensajes no se envían a otras personas. Los adjuntos conservan solo su nombre.</p></form></section></div>`}
function chatMessage(course,m){const key=threadKey(course,m.id),replies=state.chatThreads?.[key]||[],liked=state.chatReactions?.[key];return `<article class="chat-message ${m.own?'own':''}"><div class="avatar">${esc(m.initials)}</div><div class="message-body"><div class="row wrap" style="gap:8px"><b>${esc(m.author)}</b><span class="message-role">${esc(m.role)}</span><time>${esc(m.time)}</time>${m.pinned?'<span class="badge">Fijado</span>':''}</div><p>${formatChat(m.text)}</p>${(m.files||[]).map(f=>`<button class="message-file" onclick="chatAttachmentInfo(this.dataset.name)" data-name="${esc(f.name)}">${I('file')}${esc(f.name)}</button>`).join('')}<div class="message-actions"><button onclick="openThread(${course},'${m.id}')">${replies.length?replies.length+(replies.length===1?' respuesta':' respuestas'):'Responder en hilo'}</button><button class="reaction ${liked?'selected':''}" aria-label="Reaccionar al mensaje de ${esc(m.author)}" onclick="reactChat(${course},'${m.id}')">♡ ${liked?'1':'Me gusta'}</button></div></div></article>`}
function sendChat(){const c=selectedChat,text=document.querySelector('#chat-message').value.trim(),files=chatFiles[c]||[];if(!text&&!files.length){toast('Escribí un mensaje o adjuntá un archivo.');return}state.chatMessages=state.chatMessages||{};state.chatMessages[c]=state.chatMessages[c]||[];state.chatMessages[c].push({id:'m'+Date.now(),...chatIdentity(),text,files:[...files],time:new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',timeZone:'America/Guatemala'}),own:true});chatDrafts[c]='';chatFiles[c]=[];chatQuery='';save();render();const feed=document.querySelector('.chat-feed');feed.scrollTop=feed.scrollHeight;document.querySelector('#chat-message').focus()}
function attachChatFiles(files){chatDrafts[selectedChat]=document.querySelector('#chat-message').value;chatFiles[selectedChat]=[...(chatFiles[selectedChat]||[]),...[...files].map(f=>({name:f.name}))];render()}
function removeChatFile(i){chatDrafts[selectedChat]=document.querySelector('#chat-message').value;chatFiles[selectedChat].splice(i,1);render()}
function chatAttachmentInfo(name){openModal('Archivo compartido',name,'<div class="notice">Este adjunto es una demostración local. La demo conserva el nombre del archivo; no transfiere su contenido a un servidor ni a otras personas.</div>')}
function reactChat(course,id){state.chatReactions=state.chatReactions||{};const key=threadKey(course,id);state.chatReactions[key]=!state.chatReactions[key];save();render()}
function mentionMenu(){const names=['catedrático','auxiliar','Mariana','Diego','Valeria'];openModal('Mencioná a alguien',C(selectedChat).name,`<p class="small muted">La mención se resaltará en el mensaje. No envía una notificación real.</p>${names.map(n=>`<button class="file-row" style="width:100%" onclick="insertMention('${n}')">@${n}</button>`).join('')}`)}
function insertMention(name){closeModal();const input=document.querySelector('#chat-message');input.value=(input.value?input.value+' ':'')+'@'+name+' ';chatDrafts[selectedChat]=input.value;input.focus()}
function chatParticipants(id){const c=C(id);openModal('Las personas de tu clase',c.name,`<div class="group-person"><b>${teachers[c.teacher].name}</b><span class="badge">Catedrático · Ejemplo</span></div><div class="group-person"><b>${esc(auxFor(id))}</b><span class="badge">Auxiliar</span></div>${['Sofía Ortega · Vos','Mariana López','Diego Pérez','Valeria Ruiz'].map(n=>`<div class="group-person"><span>${n}</span><span class="small muted">Estudiante · Ejemplo</span></div>`).join('')}`)}
function openThread(course,id){threadTarget={course,id};threadFiles=[];renderThread()}
function renderThread(){const {course,id}=threadTarget,parent=messagesFor(course).find(m=>m.id===id),replies=state.chatThreads?.[threadKey(course,id)]||[];openModal('Respuestas en hilo',C(course).name,`<div class="thread-parent"><b>${esc(parent.author)}</b><p style="margin-top:7px;line-height:1.8">${formatChat(parent.text)}</p></div><div class="thread-replies">${replies.length?replies.map(r=>`<div class="review"><div class="row between"><b class="small">${esc(r.author)}</b><span class="small muted">${esc(r.time)}</span></div><p>${formatChat(r.text)}</p>${r.files.map(f=>`<span class="badge" style="margin-top:8px">${esc(f.name)}</span>`).join('')}</div>`).join(''):'<p class="small muted" style="padding:18px 0">Todavía no hay respuestas. Abrí la conversación.</p>'}</div><form onsubmit="event.preventDefault();sendThread()"><div class="field" style="margin-top:18px"><label for="thread-message">Tu respuesta · Podés usar @menciones</label><textarea id="thread-message" maxlength="4000" placeholder="Responder a este mensaje…"></textarea></div><div id="thread-file-list" class="row wrap"></div><div class="row between" style="margin-top:15px"><label class="btn secondary attach-chat">${I('file')}Adjuntar<input type="file" multiple hidden onchange="attachThreadFiles(this.files)"></label><button class="btn">Responder ${I('arrow')}</button></div><p class="small muted" style="margin-top:12px">Solo se guarda en esta demostración.</p></form>`)}
function attachThreadFiles(files){threadFiles=[...files].map(f=>({name:f.name}));document.querySelector('#thread-file-list').innerHTML=threadFiles.map(f=>'<span class="badge">'+esc(f.name)+'</span>').join('')}
function sendThread(){const text=document.querySelector('#thread-message').value.trim();if(!text&&!threadFiles.length){toast('Escribí una respuesta o adjuntá un archivo.');return}const key=threadKey(threadTarget.course,threadTarget.id);state.chatThreads=state.chatThreads||{};state.chatThreads[key]=state.chatThreads[key]||[];state.chatThreads[key].push({...chatIdentity(),text,files:[...threadFiles],time:new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',timeZone:'America/Guatemala'})});save();threadFiles=[];render();renderThread()}
const pensumColumns=[

let pensumFilter='Todos';
function pensumItem(item){const key=item.course?'c'+item.course:'n:'+item.name;if(item.course){const c=C(item.course);return {...item,key,name:c.name,uma:c.credits,status:state.pensumStatuses?.[key]||'En curso'}}return {...item,key,status:state.pensumStatuses?.[key]||item.status}}
function pensumStats(){const list=pensumColumns.flatMap(c=>c.items.map(pensumItem));return {approved:list.filter(i=>i.status==='Aprobado').reduce((s,i)=>s+i.uma,0),mapped:list.reduce((s,i)=>s+i.uma,0),list}}
function pensumView(){const stats=pensumStats(),percent=Math.round(stats.approved/stats.mapped*100);return heading('Mi pensum','Ingeniería Empresarial · Plan 2026E · Mapa por semestre')+`<div class="stat-row" style="margin-bottom:22px"><div class="stat"><div><b>${stats.approved}</b><span>UMA aprobadas en el tramo visible</span></div></div><div class="stat"><div><b>${totalUMA()}</b><span>UMA inscritas este período</span></div></div><div class="stat"><div><b>${stats.list.filter(i=>i.status==='Aprobado').length}</b><span>Cursos aprobados visibles</span></div></div></div><div class="panel" style="margin-bottom:22px"><div class="row between wrap"><h2>Avance del mapa disponible</h2><span class="badge">${stats.approved} de ${stats.mapped} UMA · ${percent}%</span></div><div class="progress" style="height:9px;margin:15px 0"><i style="width:${percent}%;background:var(--purple)"></i></div><p class="small muted" style="line-height:1.8">Este porcentaje corresponde solo a los cursos visibles de la captura. No representa el avance total de la carrera. Falta incorporar el resto del pensum y confirmar tu historial.</p></div><div class="row between wrap"><div class="tabs">${['Todos','Aprobado','En curso','Pendiente','Habilitado'].map(f=>`<button class="tab ${pensumFilter===f?'active':''}" onclick="pensumFilter='${f}';render()">${f}</button>`).join('')}</div><div class="row wrap pensum-legend"><span>✓ Aprobado</span><span>◉ En curso</span><span>○ Pendiente</span></div></div><div class="pensum-scroll"><div class="pensum-map">${pensumColumns.map((col,colIndex)=>`<section class="pensum-column"><div class="pensum-column-head"><h3>${col.title}</h3><span class="small muted">${col.items.map(pensumItem).reduce((s,i)=>s+i.uma,0)} UMA visibles</span></div>${col.items.map((item,index)=>{const c=pensumItem(item);if(pensumFilter!=='Todos'&&!(pensumFilter==='Habilitado'?pensumAvailability(c)==='Habilitado':c.status===pensumFilter))return '';return `<button class="pensum-course ${c.status==='Aprobado'?'approved':c.status==='En curso'?'current':'pending'}" onclick="pensumDetail(${colIndex},${index})"><div class="row between"><span class="badge">${c.uma} UMA</span><span aria-label="${c.status}">${c.status==='Aprobado'?'✓':c.status==='En curso'?'◉':'○'}</span></div><h3>${esc(c.name)}</h3><span class="small">${c.status}</span>${availabilityLabel(c)}</button>`}).join('')}</section>`).join('')}</div></div><div style="margin-top:22px">${conferenceTrack()}</div><div class="panel" style="margin-top:22px"><h2>También estás llevando</h2><p class="small muted" style="line-height:1.8;margin:10px 0 16px">Estos cursos aparecen en tu listado actual; su ubicación en el mapa completo queda por confirmar. Los workshops también forman parte de tus UMA.</p><div class="course-grid">${courses.filter(c=>[1,4,9,10].includes(c.id)).map(courseCard).join('')}</div></div><div class="notice" style="margin-top:22px">Las marcas verdes de la captura se representan como aprobadas; los cursos de tu listado actual aparecen en curso. Las relaciones de prerrequisitos son ejemplos hasta validar el plan oficial. Abrí un curso para ver qué requiere, qué habilita y probar una aprobación. La carga total oficial de la carrera queda pendiente de confirmar.</div>`}


function conferenceCount(){return (state.priorConferenceAttendance||0)+Object.values(state.conferenceEvaluations||{}).filter(r=>r.attendance).length}
function conferenceCredits(){return Math.floor(conferenceCount()/30)}
function conferenceTrack(){const count=conferenceCount(),credits=conferenceCredits(),remaining=30-count%30;return `<section class="panel conference-track" style="margin-bottom:22px"><div class="row between wrap"><div><span class="eyebrow muted">CONFERENCIAS EN TU PENSUM</span><h2 style="margin-top:9px">30 asistencias = 1 UMA</h2></div><span class="badge">${credits} UMA completadas · Demo</span></div><div class="row between" style="margin-top:20px"><b>${count} ${count===1?'asistencia acumulada':'asistencias acumuladas'}</b><span class="small muted">${count%30}/30 para la siguiente UMA</span></div><div class="progress" style="margin-top:12px;height:8px"><i style="width:${count%30/30*100}%;background:var(--purple)"></i></div><p class="small muted" style="line-height:1.8;margin-top:12px">Te faltan ${remaining} asistencias para completar la siguiente UMA. El conteo corresponde a registros de esta demo; estas UMA se muestran por separado de las 22.5 UMA inscritas de tus cursos.</p><button class="text-btn" onclick="priorConferences()">Cargar asistencias anteriores · Demo ↗</button></section>`}
function priorConferences(){openModal('Tu historial de conferencias','Carga manual de ejemplo',`<div class="notice">Para demostrar cómo se acumulan las UMA, podés cargar asistencias previas ficticias. En la plataforma real, este historial se importaría y validaría con la facultad.</div><form onsubmit="event.preventDefault();savePriorConferences()"><div class="field" style="margin-top:20px"><label for="prior-conferences">Asistencias anteriores a las registradas aquí</label><input id="prior-conferences" type="number" min="0" max="999" step="1" required value="${state.priorConferenceAttendance||0}"></div><button class="btn">Guardar historial de ejemplo</button></form>`)}
function savePriorConferences(){const raw=document.querySelector('#prior-conferences').value,n=Number(raw);if(raw===''||!Number.isInteger(n)||n<0||n>999){toast('Ingresá un número entero entre 0 y 999.');return}state.priorConferenceAttendance=n;save();closeModal();render();toast('Historial de ejemplo guardado. Equivalencia: 30 asistencias por UMA.')}
const examplePrerequisites={
 'c3':['n:Introducción a la Matemática'],
 'n:Cálculo Integral':['c3'],
 'n:Física II':['c5'],
 'n:Cálculo Multivariable':['n:Cálculo Integral'],
 'n:Statistical Thinking I':['n:Introducción a la Matemática'],
 'n:Statistical Thinking II':['n:Statistical Thinking I'],
 'n:Ecuaciones Diferenciales':['n:Cálculo Integral']
};
function curriculumNodes(){return pensumColumns.flatMap((col,column)=>col.items.map((item,index)=>({...pensumItem(item),column,index})))}
function prerequisiteNodes(c){return (examplePrerequisites[c.key]||[]).map(key=>curriculumNodes().find(n=>n.key===key)).filter(Boolean)}
function pensumAvailability(c){if(c.status!=='Pendiente')return c.status;const requirements=prerequisiteNodes(c);if(!requirements.length)return 'Por confirmar';return requirements.every(n=>n.status==='Aprobado')?'Habilitado':'Requisitos pendientes'}
function availabilityLabel(c){if(c.status!=='Pendiente')return '';const a=pensumAvailability(c);return `<span class="badge ${a==='Habilitado'?'green':''}" style="margin-top:8px;white-space:normal">${a==='Por confirmar'?'Requisitos por confirmar':a+' · Ejemplo'}</span>`}
function pensumDetail(column,index){const c=pensumItem(pensumColumns[column].items[index]),requirements=prerequisiteNodes(c),unlocks=curriculumNodes().filter(n=>(examplePrerequisites[n.key]||[]).includes(c.key));openModal(c.name,pensumColumns[column].title,`<div class="rubric"><b>${c.status}</b><br>Valor: ${c.uma} UMA<br>${pensumAvailability(c)==='Habilitado'?'✓ Requisitos de ejemplo completados':pensumAvailability(c)==='Requisitos pendientes'?'Hay prerrequisitos de ejemplo pendientes':'Estado del mapa disponible'}</div><div class="notice" style="margin-top:16px">Las relaciones de prerrequisitos son ilustrativas hasta validar tu plan oficial. Podés probar cómo se habilitan los cursos al cambiar un estado.</div><h3>Para llevar este curso</h3>${requirements.length?requirements.map(n=>`<div class="file-row"><span>${esc(n.name)}</span><span class="badge ${n.status==='Aprobado'?'green':''}">${n.status==='Aprobado'?'✓ Aprobado':n.status}</span></div>`).join(''):'<p class="small muted">Prerrequisitos oficiales pendientes de confirmar.</p>'}<h3>Al aprobarlo, avanzás hacia</h3>${unlocks.length?unlocks.map(n=>`<button class="file-row" style="width:100%;text-align:left" onclick="pensumDetail(${n.column},${n.index})"><span>${esc(n.name)}</span><span class="badge ${pensumAvailability(n)==='Habilitado'?'green':''}" style="white-space:normal">${pensumAvailability(n)}</span></button>`).join(''):'<p class="small muted">Todavía no hay relaciones configuradas para este curso.</p>'}<div class="row wrap" style="margin-top:22px"><button class="btn soft" ${c.status==='Aprobado'&&!state.pensumStatuses?.[c.key]?'disabled':''} onclick="simulatePensum(${column},${index})">${state.pensumStatuses?.[c.key]?'Restablecer estado de referencia':c.status==='Aprobado'?'Aprobado según referencia':'Simular curso aprobado'}</button>${c.course?`<button class="btn secondary" onclick="closeModal();activeCourse=${c.course};nav('course')">Abrir mi curso ↗</button>`:''}</div><p class="small muted" style="line-height:1.8;margin-top:12px">Los cambios de esta prueba no modifican tu historial universitario, tus notas ni tus UMA inscritas.</p>`)}
function simulatePensum(column,index){const c=pensumItem(pensumColumns[column].items[index]);state.pensumStatuses=state.pensumStatuses||{};if(c.status==='Aprobado')delete state.pensumStatuses[c.key];else state.pensumStatuses[c.key]='Aprobado';save();closeModal();render();pensumDetail(column,index)}

function conferenceWeekView(events){const start=weekStart(),days=Array.from({length:7},(_,i)=>new Date(start.getTime()+i*86400000)),end=days[6],inWeek=events.filter(e=>e.dateISO>=isoDay(start)&&e.dateISO<=isoDay(end));return `<section class="panel faculty-calendar"><div class="row between wrap" style="margin-bottom:20px"><div><h2>${start.toLocaleDateString('es-GT',{day:'numeric',month:'long',timeZone:'UTC'})} – ${end.toLocaleDateString('es-GT',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}</h2><p class="small muted" style="margin-top:8px">Vista semanal · Calendario de facultad · Eventos de ejemplo</p></div><div class="row"><button class="icon-btn" aria-label="Semana anterior de conferencias" onclick="conferenceWeek--;render()">‹</button><button class="btn secondary" onclick="conferenceWeek=0;render()">Esta semana</button><button class="icon-btn" aria-label="Semana siguiente de conferencias" onclick="conferenceWeek++;render()">›</button></div></div><div class="faculty-calendar-scroll"><div class="faculty-week"><div class="week-hours"><div class="week-day-spacer"></div>${Array.from({length:10},(_,i)=>`<div>${i+9}:00</div>`).join('')}</div>${days.map((day,index)=>`<section class="week-day"><header><span>${['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][index]}</span><b class="${isoDay(day)==='2026-11-01'?'calendar-today':''}">${day.getUTCDate()}</b></header><div class="week-day-body">${Array(10).fill('<div class="week-hour-line"></div>').join('')}${inWeek.filter(e=>e.dateISO===isoDay(day)).map(e=>{const hour=Number(e.start.slice(0,2))+Number(e.start.slice(3))/60;return `<button class="week-event" style="top:${(hour-9)*52}px;height:${e.minutes/60*52}px" onclick="conferenceDetails('${e.id}')"><b>${e.title}</b><span>${e.start} · ${e.room}</span></button>`}).join('')}</div></section>`).join('')}</div></div>${!inWeek.length?'<p class="small muted" style="padding-top:15px">No hay conferencias de esta facultad en la semana seleccionada.</p>':''}</section>`}
function conferenceHistory(events,onlyPending){const list=events.filter(e=>state.conferenceScans?.[e.id]||state.conferenceEvaluations?.[e.id]).filter(e=>!onlyPending||(!state.conferenceEvaluations?.[e.id]&&scanState(e.id).exit));return `<section class="panel"><h2>${onlyPending?'Evaluaciones pendientes':'Conferencias que ya recibiste'}</h2><div class="conference-history">${list.length?list.map(e=>`<article class="conference-history-item"><div class="row between wrap"><h3>${e.title}</h3><span class="badge ${state.conferenceEvaluations?.[e.id]?'green':'orange'}">${conferenceStatus(e)}</span></div><p class="small muted" style="margin-top:8px">${e.date}</p><p class="small" style="line-height:1.8;margin:12px 0">${e.desc}</p><div class="row wrap">${state.conferenceEvaluations?.[e.id]?`<button class="btn secondary" onclick="conferenceReceipt('${e.id}')">Ver comprobante</button>`:`<button class="btn ${scanState(e.id).exit?'':'secondary'}" onclick="evaluateConference('${e.id}')">Evaluar conferencia</button><button class="text-btn" onclick="showPersonalQR('${e.id}')">${scanState(e.id).entry?'Revisar entrada y salida':'Registrar asistencia · Demo'} ↗</button>`}</div></article>`).join(''):'<div class="empty">Las conferencias aparecerán aquí al registrar tu asistencia. Las evaluaciones se habilitan después de registrar entrada y salida.</div>'}</div></section>`}
function conferenceDetails(id){const e=conferenceEvents.find(e=>e.id===id);openModal(e.title,e.faculty,`<div class="rubric">${e.date}<br>${e.room}<br>${e.speaker}</div><p style="margin-top:18px;font-size:13px;line-height:1.8">${e.desc}</p><p class="small muted" style="margin-top:12px">La asistencia cuenta para las UMA al completar la evaluación, después del registro de entrada y salida.</p>`,`<button class="btn secondary" onclick="downloadConferenceCalendar('${id}')">Agregar a mi calendario</button>${!e.upcoming?`<button class="btn" onclick="showPersonalQR('${id}')">Mostrar mi QR</button>`:''}`)}
function showPersonalQR(eventId){const eligible=facultyEvents().filter(e=>!e.upcoming);const e=conferenceEvents.find(e=>e.id===eventId)||eligible[0]||conferenceEvents[0],scans=scanState(e.id);openModal('Tu QR personal','Sofía Ortega · Perfil de demostración',`<div class="personal-qr"><img src="${personalQRAsset}" alt="QR personal de demostración de Sofía Ortega"><div><span class="badge">Personal · MiU</span><h3 style="margin-top:12px">Sofía Ortega</h3><p class="small muted" style="line-height:1.8;margin-top:8px">Mostrá el mismo QR al entrar y al salir de la conferencia. El personal registra ambos escaneos.</p></div></div><div class="field"><label for="qr-event">Probar el registro en una conferencia</label><select id="qr-event" onchange="showPersonalQR(this.value)">${conferenceEvents.filter(x=>!x.upcoming).map(x=>`<option value="${x.id}" ${e.id===x.id?'selected':''}>${x.title}</option>`).join('')}</select></div><div class="qr-scan-states"><div><span class="small muted">Entrada</span><b>${scans.entry?esc(scans.entry):'Sin registrar'}</b></div><div><span class="small muted">Salida</span><b>${scans.exit?esc(scans.exit):'Sin registrar'}</b></div></div><div class="row wrap" style="margin-top:18px"><button class="btn secondary" ${scans.entry?'disabled':''} onclick="simulateConferenceScan('${e.id}','entry')">${scans.entry?'✓ Entrada registrada':'Simular escaneo de entrada'}</button><button class="btn secondary" ${!scans.entry||scans.exit?'disabled':''} onclick="simulateConferenceScan('${e.id}','exit')">${scans.exit?'✓ Salida registrada':'Simular escaneo de salida'}</button></div><p class="small muted" style="margin-top:15px;line-height:1.8">Este QR contiene un identificador ficticio. Los botones simulan al personal de ingreso y no usan la cámara ni registran asistencia real.</p>`,scans.exit?`<button class="btn" onclick="evaluateConference('${e.id}')">${state.conferenceEvaluations?.[e.id]?'Ver comprobante':'Continuar a evaluación'} ${I('arrow')}</button>`:'')}
function simulateConferenceScan(id,kind){state.conferenceScans=state.conferenceScans||{};state.conferenceScans[id]=state.conferenceScans[id]||{};const scans=state.conferenceScans[id];if(kind==='exit'&&!scans.entry){toast('Primero debe registrarse la entrada.');return}if(scans[kind])return;scans[kind]=new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',timeZone:'America/Guatemala'});save();render();showPersonalQR(id)}
function evaluateConference(id){const e=conferenceEvents.find(e=>e.id===id);if(state.conferenceEvaluations?.[id])return conferenceReceipt(id);if(!scanState(id).entry||!scanState(id).exit){showPersonalQR(id);toast('Registrá entrada y salida con tu QR antes de evaluar.');return}openModal('Evaluá tu conferencia',e.title,`<div class="notice"><b>Entrada y salida registradas</b><br>Completá la evaluación para que esta asistencia cuente para tus UMA. La opinión se plantea como anónima; esta demo guarda datos solo en este navegador.</div><form onsubmit="event.preventDefault();submitConference('${id}')">${[['speaker','Conferencista'],['content','Contenido'],['organization','Organización']].map(([key,title])=>`<fieldset class="rating-field"><legend>${title}</legend><div class="rating-options">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rating-${key}" value="${n}" required><span>${n} ★</span></label>`).join('')}</div><p class="small muted" style="margin-top:7px">1 = Muy insatisfecho · 5 = Muy satisfecho</p></fieldset>`).join('')}<div class="field"><label for="conference-comment">Comentario · Opcional</label><textarea id="conference-comment" maxlength="1200" placeholder="¿Qué te gustó y qué mejorarías?"></textarea></div><button class="btn" style="width:100%">Enviar evaluación y acreditar asistencia ${I('check')}</button></form>`)}
function submitConference(id){if(state.conferenceEvaluations?.[id])return conferenceReceipt(id);if(!scanState(id).entry||!scanState(id).exit){toast('Falta registrar entrada o salida.');return}const ratings={};for(const key of ['speaker','content','organization']){const input=document.querySelector(`input[name="rating-${key}"]:checked`);if(!input){toast('Completá las tres valoraciones.');return}ratings[key]=Number(input.value)}state.conferenceEvaluations=state.conferenceEvaluations||{};state.conferenceEvaluations[id]={code:'MIU-CONF-'+id.toUpperCase()+'-'+String(Date.now()).slice(-5),time:new Date().toLocaleString('es-GT',{timeZone:'America/Guatemala'}),ratings,comment:document.querySelector('#conference-comment').value.trim(),attendance:true};save();closeModal();render();conferenceReceipt(id);toast('Evaluación recibida. Se sumó una asistencia a tus conferencias.')}
function conferenceCalendarSettings(){openModal('Conferencias en Google Calendar',faculty,`<div class="notice">En la conexión propuesta recibirías las conferencias futuras de tu facultad. El inicio de sesión y la sincronización de Google continúan simulados.</div><label class="check-row" style="margin-top:18px"><input type="checkbox" checked disabled>Incluir las conferencias de ${esc(faculty)}</label><p class="small muted" style="line-height:1.8;margin:18px 0">También podés descargar los eventos de ejemplo como archivo de calendario para importarlos en Google Calendar.</p><div class="row wrap"><button class="btn secondary" onclick="downloadConferenceCalendar()">Descargar calendario (.ics)</button><button class="btn" onclick="state.conferenceCalendarSync=true;save();closeModal();render();toast('Calendario de facultad conectado en la demo.')">Conectar · Demo</button></div>`)}
function downloadConferenceCalendar(id){const list=id?[conferenceEvents.find(e=>e.id===id)]:facultyEvents().filter(e=>e.dateISO>='2026-11-01');const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const safe=s=>s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const parts=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MiU//Conferencias Demo//ES','CALSCALE:GREGORIAN'];for(const e of list){const start=new Date(e.dateISO+'T'+e.start+':00-06:00'),end=new Date(start.getTime()+e.minutes*60000);parts.push('BEGIN:VEVENT','UID:miu-demo-'+e.id+'@universidad.example','DTSTAMP:20261101T120000Z','DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+safe(e.title),'LOCATION:'+safe(e.room),'DESCRIPTION:'+safe(e.desc+' Evento de ejemplo de MiU.'),'END:VEVENT')}parts.push('END:VCALENDAR');const url=URL.createObjectURL(new Blob([parts.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='MiU-conferencias-demo.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Calendario de ejemplo descargado.')}
